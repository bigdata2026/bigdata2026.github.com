<html lang="en">
<head>

<title>Week 5: CAP Theorem &amp; NoSQL — Ultimate Class Test Prep</title>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#23263a;--border:#2e3250;
  --accent:#6c63ff;--accent2:#00d4aa;--correct:#00c97b;--wrong:#ff4f6d;
  --warn:#ffb347;--text:#e8eaf6;--muted:#8b8fa8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:24px 16px;
}
header{text-align:center;margin-bottom:28px;}
header h1{
  font-size:1.9rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
header p{color:var(--muted);margin-top:6px;font-size:.9rem;}
#prog-wrap{width:100%;max-width:780px;background:var(--surface2);
  border-radius:999px;height:7px;margin-bottom:8px;overflow:hidden;}
#prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:999px;transition:width .4s;width:0%;}
#prog-label{width:100%;max-width:780px;text-align:right;color:var(--muted);
  font-size:.8rem;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:28px 32px;width:100%;max-width:780px;}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.badge{font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;padding:3px 10px;border-radius:999px;}
.b-mc {background:#6c63ff22;color:var(--accent); border:1px solid #6c63ff55;}
.b-ms {background:#ff4f6d22;color:var(--wrong);  border:1px solid #ff4f6d55;}
.b-tf {background:#00d4aa22;color:var(--accent2);border:1px solid #00d4aa55;}
.b-ste{background:#ffb34722;color:var(--warn);   border:1px solid #ffb34755;}
.pts-badge{font-size:.75rem;font-weight:700;color:var(--warn);padding:3px 10px;
  background:#ffb34711;border:1px solid #ffb34733;border-radius:999px;}
.topic-badge{font-size:.7rem;color:var(--muted);padding:3px 10px;
  background:var(--surface2);border:1px solid var(--border);border-radius:999px;}
.qnum{color:var(--muted);font-size:.8rem;margin-left:auto;}
#qtext{font-size:1.05rem;font-weight:600;line-height:1.65;margin-bottom:20px;
  color:var(--text);white-space:pre-wrap;}
#qhint{font-size:.82rem;color:var(--muted);font-style:italic;
  margin-bottom:10px;display:none;padding:8px 12px;
  background:var(--surface2);border-radius:6px;border-left:3px solid var(--accent);}
#qopts{display:flex;flex-direction:column;gap:9px;}
.opt{background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);cursor:pointer;font-size:.95rem;
  padding:12px 16px;text-align:left;
  display:flex;align-items:flex-start;gap:11px;
  transition:border-color .2s,background .2s;}
.opt:hover:not([disabled]){border-color:var(--accent);background:#2a2d42;}
.ltr{background:var(--border);border-radius:5px;min-width:27px;height:27px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.78rem;flex-shrink:0;transition:background .2s,color .2s;}
.opt-text{line-height:1.45;padding-top:1px;}
.opt.correct{border-color:var(--correct)!important;background:#00c97b18;}
.opt.correct .ltr{background:var(--correct);color:#000;}
.opt.wrong{border-color:var(--wrong)!important;background:#ff4f6d18;}
.opt.wrong .ltr{background:var(--wrong);color:#fff;}
.opt.reveal{border-color:var(--correct)!important;background:#00c97b0d;}
.opt.reveal .ltr{background:#00c97b55;color:var(--correct);}
.opt.sel{border-color:var(--accent)!important;background:#6c63ff18;}
.opt.sel .ltr{background:var(--accent);color:#fff;}
#submit-btn{
  display:none;margin-top:14px;padding:10px 26px;
  background:var(--accent);border:none;border-radius:9px;
  color:#fff;font-weight:700;font-size:.93rem;cursor:pointer;
}
#submit-btn:hover{opacity:.85;}
#fb{display:none;margin-top:20px;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:16px 18px;
  font-size:.93rem;line-height:1.65;}
.fb-title{font-weight:800;font-size:1rem;margin-bottom:8px;}
.fb-ok .fb-title{color:var(--correct);}
.fb-bad .fb-title{color:var(--wrong);}
.fb-body{color:var(--text);white-space:pre-wrap;line-height:1.7;}
#nav-row{display:flex;justify-content:flex-end;margin-top:22px;}
#next-btn{
  display:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:9px;color:#fff;cursor:pointer;
  font-size:.97rem;font-weight:700;padding:11px 28px;
}
#next-btn:hover{opacity:.9;}
/* Results */
#results-screen{display:none;width:100%;max-width:780px;}
.rcard{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:32px;text-align:center;}
.score-ring{width:130px;height:130px;margin:0 auto 22px;
  position:relative;display:flex;align-items:center;justify-content:center;}
.score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.score-ring circle{fill:none;stroke-width:9;}
.trk{stroke:var(--surface2);}
.fil{stroke:var(--accent2);stroke-linecap:round;
  stroke-dasharray:377;stroke-dashoffset:377;
  transition:stroke-dashoffset 1.2s ease;}
.pct-text{position:relative;font-size:1.8rem;font-weight:900;color:var(--accent2);}
.rcard h2{font-size:1.45rem;margin-bottom:7px;}
.r-sub{color:var(--muted);margin-bottom:24px;font-size:.93rem;}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:22px;}
.pill{font-size:.76rem;padding:3px 11px;border-radius:999px;font-weight:600;}
.pill.weak{background:#ff4f6d22;color:var(--wrong);border:1px solid #ff4f6d55;}
.pill.ok  {background:#ffb34722;color:var(--warn); border:1px solid #ffb34755;}
.pill.str {background:#00c97b22;color:var(--correct);border:1px solid #00c97b55;}
.r-sect{color:var(--muted);font-size:.78rem;text-transform:uppercase;
  letter-spacing:.07em;margin:16px 0 8px;text-align:left;}
.r-item{background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:11px 15px;margin-bottom:7px;
  display:flex;gap:11px;align-items:flex-start;text-align:left;}
.r-ico{font-size:1rem;flex-shrink:0;margin-top:2px;}
.r-txt{font-size:.87rem;line-height:1.5;}
.r-topic{font-weight:700;color:var(--accent2);font-size:.74rem;
  text-transform:uppercase;display:block;margin-bottom:2px;}
.r-q{color:var(--text);}
.r-wrong{color:var(--wrong);font-size:.81rem;margin-top:4px;display:block;}
.retry-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:9px;color:#fff;cursor:pointer;
  font-size:.97rem;font-weight:700;padding:13px 36px;margin-top:26px;
}
.retry-btn:hover{opacity:.9;}
</style>

<div id="quiz-screen">
  <div id="prog-wrap"><div id="prog-bar"></div></div>

    </div>

    <p class="r-sub" id="r-sub"></p>

<script>
var QS=[
// ═══════════════════════════════════════════════════════════
// RELATIONAL DATABASE TECHNOLOGY (Slides 1-2)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-01","pts":2,"type":"MC","topic":"Relational Databases",
  "q":"When was relational database technology invented?",
  "opts":["1950s","1970s","1990s","2005"],
  "ans":1,
  "exp":"Relational databases were invented in the 1970s, pioneered by Edgar F. Codd's 1970 paper on the relational model. They are well-founded theoretically on relational algebra and provide high consistency. The 1950s saw early mainframe computing. 1990s brought the web era. 2005 is when Hadoop and the term 'Big Data' emerged."
},
{
  "id":"W5-02","pts":2,"type":"MC","topic":"Relational Databases",
  "q":"Which theoretical foundation underpins relational databases?",
  "opts":["Graph theory","Relational algebra","Quantum computing","Neural network theory"],
  "ans":1,
  "exp":"Relational databases are well-founded theoretically on RELATIONAL ALGEBRA — a formal system of operations (select, project, join, union, etc.) on relations (tables). This mathematical basis is why SQL is so powerful and predictable. Graph theory underlies graph databases like Neo4j. The other options have no connection to RDBMS theory."
},
{
  "id":"W5-03","pts":2,"type":"MS","topic":"Relational Databases",
  "q":"Which of the following are listed in the lecture as added capabilities of relational databases? (Select ALL that apply)",
  "opts":["BLOB storage","GIS extensions","Automatic horizontal sharding","Data warehousing (star schema)"],
  "ans":[0,1,3],
  "exp":"The lecture explicitly lists these RDBMS capabilities: BLOB storage, document store, text search, in-database code execution, data warehousing (star schema), and GIS extensions. Automatic horizontal sharding is a NoSQL feature — RDBMS are excellent for CENTRALISED storage but were never designed for automatic distribution across servers."
},
{
  "id":"W5-04","pts":2,"type":"TF","topic":"Relational Databases",
  "q":"True or False: Relational databases are excellent at coping with centralised storage.",
  "opts":["True","False"],
  "ans":0,
  "exp":"TRUE. The lecture explicitly states RDBs are 'excellent to cope with centralised storage.' This is their strength — a single powerful server running a well-tuned RDBMS handles structured data brilliantly. The problem arises when you need DISTRIBUTED storage across many servers at internet scale — that's where RDBMS struggle and NoSQL steps in."
},
// ═══════════════════════════════════════════════════════════
// ACID PROPERTIES (Slide 3)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-05","pts":2,"type":"MC","topic":"ACID Properties",
  "q":"What does ACID stand for in database systems?",
  "opts":["Atomicity, Consistency, Isolation, Durability","Availability, Consistency, Integrity, Distribution","Aggregation, Consistency, Isolation, Data","Atomicity, Concurrency, Indexing, Distribution"],
  "ans":0,
  "exp":"ACID = Atomicity (all-or-nothing transactions), Consistency (data valid before AND after transaction), Isolation (concurrent transactions don't interfere), Durability (committed changes survive crashes). These four properties together guarantee reliable transaction processing in relational databases. All other options are fabricated acronyms."
},
{
  "id":"W5-06","pts":2,"type":"MC","topic":"ACID Properties",
  "q":"In ACID, 'Atomicity' means:",
  "opts":["Data must be consistent before and after a transaction","The entire transaction takes place at once or doesn't happen at all","Multiple transactions occur independently","Committed changes persist even after failure"],
  "ans":1,
  "exp":"Atomicity = the entire transaction takes place at once OR doesn't happen at all. There is NO partial execution. Think bank transfer: BOTH the debit from Account A AND credit to Account B happen, or NEITHER does. You never end up with money deducted but not credited. Option A = Consistency. Option C = Isolation. Option D = Durability."
},
{
  "id":"W5-07","pts":2,"type":"MC","topic":"ACID Properties",
  "q":"Which ACID property states: 'The data must be consistent before and after the transaction'?",
  "opts":["Atomicity","Consistency","Isolation","Durability"],
  "ans":1,
  "exp":"Consistency ensures the database transitions from one VALID state to another valid state. Every transaction must leave the database in a correct state that satisfies all defined rules and constraints. If a transaction would violate a constraint, it is rolled back entirely (thanks to Atomicity). The database is never left in a corrupted or invalid state."
},
{
  "id":"W5-08","pts":2,"type":"MC","topic":"ACID Properties",
  "q":"In ACID, 'Isolation' guarantees that:",
  "opts":["The transaction happens all at once","Data stays valid","Multiple transactions occur independently without interference","Changes survive system crashes"],
  "ans":2,
  "exp":"Isolation means multiple transactions can occur CONCURRENTLY but they execute INDEPENDENTLY without interfering with each other. Each transaction appears to run as if it's the only one accessing the database. This prevents dirty reads, phantom reads, and other concurrency problems. It does NOT mean only one transaction runs at a time — that would be far too slow."
},
{
  "id":"W5-09","pts":2,"type":"MC","topic":"ACID Properties",
  "q":"Which ACID property ensures committed changes survive even if the entire system crashes?",
  "opts":["Atomicity","Consistency","Isolation","Durability"],
  "ans":3,
  "exp":"Durability guarantees that once a transaction has been committed, it PERSISTS even if the system fails — power loss, hardware crash, software error. Data is written to non-volatile storage (disk). Like carving something in stone — once it's committed, it's permanent. Atomicity = all-or-nothing. Consistency = valid states. Isolation = independence."
},
// ═══════════════════════════════════════════════════════════
// RDBMS LIMITATIONS & INTERNET (Slides 4-5)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-10","pts":2,"type":"MC","topic":"RDBMS Limitations",
  "q":"What does intensive online access to data (internet-scale applications) require?",
  "opts":["Only consistency","Availability, scalability, and speed","Only durability","Only isolation"],
  "ans":1,
  "exp":"The lecture states that intensive online access to data requires: Availability (always respond), Scalability (handle growing load), and Speed (fast responses). It also notes that 'consistency cannot be ensured at all times' — this is the fundamental tension that leads to CAP theorem and the need for NoSQL databases."
},
{
  "id":"W5-11","pts":3,"type":"MS","topic":"RDBMS Limitations",
  "q":"Which are limitations of relational databases according to the lecture? (Select ALL that apply)",
  "opts":["Low response time with massive amounts of data","Expensive scale-up (adding memory, CPU)","Limited analytical capabilities (need OLAP schemas)","Cannot store structured data"],
  "ans":[0,1,2],
  "exp":"The lecture lists three specific RDBMS limitations: (1) Low response time with massive data / fast querying becomes difficult, (2) Expensive scale-up — adding memory and CPU to a single machine is costly, (3) Limited analytical capabilities requiring special OLAP-like schemas. Option D is WRONG — RDBMS are EXCELLENT at structured data. That's their core strength."
},
// ═══════════════════════════════════════════════════════════
// DISTRIBUTED DATABASES (Slides 6-8)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-12","pts":2,"type":"MC","topic":"Distributed Databases",
  "q":"What is a Distributed Database Management System (DDBMS)?",
  "opts":["A database stored on one powerful server","A system where data is stored in different nodes interconnected by a computer network","A database that only stores JSON","A type of graph database"],
  "ans":1,
  "exp":"A DDBMS has data stored in different NODES that are interconnected by a computer network. The nodes are databases themselves, and DDBMS software manages the distributed database, handling access and transparent distribution. A single-server DB is centralised. JSON storage is a document store feature. Graph databases are a NoSQL type."
},
{
  "id":"W5-13","pts":2,"type":"TF","topic":"Distributed Databases",
  "q":"True or False: In a DDBMS, users are aware of which fragments store their data and must query specific fragments directly.",
  "opts":["True","False"],
  "ans":1,
  "exp":"FALSE. The lecture explicitly states: 'User unaware of fragments and their replication. Queries specified on the relations (original schema) and not on fragments.' This distribution TRANSPARENCY is a key feature — the DDBMS software handles routing queries to correct fragments behind the scenes. Users interact with the database as if it were a single system."
},
// ═══════════════════════════════════════════════════════════
// FRAGMENTATION, SHARDING, REPLICATION (Slides 6-8)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-14","pts":3,"type":"MC","topic":"Fragmentation & Sharding",
  "q":"In horizontal partitioning (fragmentation), a table is split by:",
  "opts":["Splitting columns across servers","Splitting rows into separate subsets on different servers","Duplicating the entire table","Converting to a graph structure"],
  "ans":1,
  "exp":"Horizontal partitioning splits a table BY ROWS. Different subsets of rows go to different servers. Example: Users 1-1000 on Server A, Users 1001-2000 on Server B. Splitting by COLUMNS is vertical partitioning. Duplicating everywhere is replication. Converting to graphs is a completely different data model."
},
{
  "id":"W5-15","pts":3,"type":"MC","topic":"Fragmentation & Sharding",
  "q":"In vertical partitioning (fragmentation), a table is split by:",
  "opts":["Splitting rows into subsets","Splitting columns into separate tables, keeping the key in each fragment","Time-based ranges","Hash-based distribution"],
  "ans":1,
  "exp":"Vertical partitioning splits a table BY COLUMNS. Each fragment contains a subset of columns plus the primary key (so fragments can be reassembled). Example: (ID, Name) on Server A and (ID, Avatar, Bio) on Server B. Splitting by rows is horizontal. Time-based and hash-based are specific distribution strategies."
},
{
  "id":"W5-16","pts":2,"type":"MC","topic":"Fragmentation & Sharding",
  "q":"What is 'database sharding'?",
  "opts":["A backup strategy","Another name for partitioning where shards are stored on different computers","An encryption technique","A type of indexing"],
  "ans":1,
  "exp":"The lecture defines sharding as 'another way of naming partitioning' where the table is partitioned into shards that are NECESSARILY stored on different computers, and queries run on separate shards. It is specifically distributed partitioning. Not a backup strategy, encryption technique, or indexing method."
},
{
  "id":"W5-17","pts":2,"type":"MC","topic":"Fragmentation & Sharding",
  "q":"In 2011, Facebook split its MySQL database into how many shards?",
  "opts":["400","4,000","40,000","400,000"],
  "ans":1,
  "exp":"Facebook split its MySQL database into 4,000 shards in 2011 to handle the site's massive data volume. This is a key fact from the lecture illustrating that even relational databases like MySQL can be sharded at scale, though it requires enormous engineering effort — which is one reason NoSQL databases with built-in sharding became popular."
},
// ═══════════════════════════════════════════════════════════
// DIMENSIONS OF DISTRIBUTED DB SYSTEMS (Slide 9-10)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-18","pts":3,"type":"MC","topic":"Distributed DB Dimensions",
  "q":"What are the three dimensions used to characterise distributed database systems?",
  "opts":["Speed, Storage, Security","Distribution, Heterogeneity, Autonomy","Consistency, Availability, Partition Tolerance","Volume, Velocity, Variety"],
  "ans":1,
  "exp":"The three dimensions are: Distribution (D0=none, D1=client-server, D2=peer-to-peer), Heterogeneity (H0=same tech, H1=different tech), and Autonomy (A0=tight integration, A1=semi-autonomous, A2=fully independent). CAP (C, A, P) describes properties, not dimensions. The 3 Vs describe Big Data characteristics, not database architecture."
},
{
  "id":"W5-19","pts":2,"type":"MC","topic":"Distributed DB Dimensions",
  "q":"In the Distribution dimension, D2 refers to:",
  "opts":["No distribution","Client-server architecture","Peer-to-peer distribution","Cloud-only distribution"],
  "ans":2,
  "exp":"D0 = no distribution (single machine), D1 = client-server (clients query a central server), D2 = peer-to-peer (all nodes are equal, no central authority). Peer-to-peer is the most distributed mode — like Cassandra where every node can accept reads and writes. Cloud-only is not a defined distribution level."
},
{
  "id":"W5-20","pts":2,"type":"MC","topic":"Distributed DB Dimensions",
  "q":"In the Autonomy dimension, what does A0 mean?",
  "opts":["Fully independent nodes","Semi-autonomous nodes that implement sharing","Tight integration with a single coordinator","No database exists"],
  "ans":2,
  "exp":"A0 = tight integration with a single coordinator controlling all nodes. A1 = semi-autonomous (nodes implement some sharing capabilities). A2 = fully independent (sharing is done by separate software). The scale goes from most centrally controlled (A0) to most independent (A2). 'No database' is not a valid autonomy level."
},
{
  "id":"W5-21","pts":3,"type":"MC","topic":"Distributed DB Dimensions",
  "q":"In the taxonomy slide, a homogeneous distributed database has which dimension values?",
  "opts":["A0, D2, H0","A2, D0, H1","A1, D1, H0","A2, D2, H1"],
  "ans":0,
  "exp":"A homogeneous distributed database is classified as A0 (tight integration), D2 (peer-to-peer distribution), H0 (homogeneous — same technology everywhere). This means all nodes use the same DBMS software under centralised coordination. A heterogeneous (multi-DB) system, by contrast, uses different technologies (H1) with varying autonomy levels."
},
{
  "id":"W5-22","pts":2,"type":"MC","topic":"Distributed DB Dimensions",
  "q":"What is a 'federated' database system?",
  "opts":["A single centralised database","A heterogeneous distributed system where independent databases interoperate","A graph database","A key-value store"],
  "ans":1,
  "exp":"A federated database system is a heterogeneous (multi-DB) system classified as A2 (fully independent), Dx (any distribution), Hy (heterogeneous). Independent databases interoperate — either loosely coupled (using export schemas) or tightly coupled (using a global schema). It's about making different, independent databases work together."
},
// ═══════════════════════════════════════════════════════════
// CHALLENGES OF DISTRIBUTED SYSTEMS (Slide 11)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-23","pts":3,"type":"MS","topic":"Distributed DB Challenges",
  "q":"What does the lecture say large-scale internet applications require from storage? (Select ALL that apply)",
  "opts":["Increasable data capacity","Growing read/write throughput","Handle highly concurrent access","Strong schema enforcement"],
  "ans":[0,1,2],
  "exp":"The lecture lists three requirements: (1) Increasable data capacity, (2) Growing read/write throughput, (3) Handle highly concurrent access. These all require HORIZONTAL scaling. Strong schema enforcement is an RDBMS feature that actually makes scaling harder — NoSQL drops fixed schemas specifically to enable these three requirements."
},
// ═══════════════════════════════════════════════════════════
// CAP THEOREM — PROPERTIES (Slides 12-13)
// ═══════════════════════════════════════════════════════════
{
  "id":"W5-24","pts":3,"type":"MC","topic":"CAP Theorem",
  "q":"In the CAP theorem, 'Consistency' means:",
  "opts":["The system always responds to requests","A read is guaranteed to return the most recent write — all nodes see the same data","The system works despite network splits","Data is stored in a consistent file format"],
  "ans":1,
  "exp":"CAP Consistency: 'The system assures that operations are atomic, and changes are disseminated simultaneously to all nodes, with same results. A read is guaranteed to return the most recent write.' If you write data on Node 1, reading from Node 3 must immediately return that updated data. Option A = Availability. Option C = Partition Tolerance. Option D is nonsense."
},
{
  "id":"W5-25","pts":3,"type":"MC","topic":"CAP Theorem",
  "q":"In the CAP theorem, 'Availability' means:",

// ═══════════════════════════════════════════════════════════
// QUIZ ENGINE (identical to sample quiz)
// ═══════════════════════════════════════════════════════════
var cur=0,score=0,earnedPts=0,totalPts=0;
var answered=[],shuffled=[],selMulti=[];

function shuffleArr(a){
  var arr=a.slice();
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}

function initQuiz(){
  cur=0;score=0;earnedPts=0;answered=[];selMulti=[];
  shuffled=shuffleArr(QS);
  totalPts=0;
  for(var i=0;i<shuffled.length;i++) totalPts+=shuffled[i].pts;
  document.getElementById("results-screen").style.display="none";
  document.getElementById("quiz-screen").style.display="block";
  renderQ();
}

function renderQ(){
  var q=shuffled[cur];
  selMulti=[];
  var tot=shuffled.length;
  document.getElementById("prog-bar").style.width=(cur/tot*100)+"%";
  document.getElementById("prog-label").textContent="Question "+(cur+1)+" of "+tot;
  var badge=document.getElementById("qbadge");
  var typeMap={"MC":"Multiple Choice","MS":"Multi-Select","TF":"True / False","STE":"Spot the Error"};
  var clsMap={"MC":"badge b-mc","MS":"badge b-ms","TF":"badge b-tf","STE":"badge b-ste"};
  badge.className=clsMap[q.type]||"badge b-mc";
  badge.textContent=typeMap[q.type]||q.type;
  document.getElementById("qpts").textContent=q.pts+" pts";
  document.getElementById("qtopic").textContent=q.topic;
  document.getElementById("qnum").textContent=(cur+1)+"/"+tot;
  document.getElementById("qtext").textContent=q.q;
  var hint=document.getElementById("qhint");
  if(q.type==="MS"){hint.style.display="block";hint.textContent="Select ALL correct answers, then click Submit.";}
  else{hint.style.display="none";}
  var container=document.getElementById("qopts");
  container.innerHTML="";
  for(var i=0;i<q.opts.length;i++){
    var btn=document.createElement("button");
    btn.className="opt";
    btn.setAttribute("data-i",i);
    var ltr=document.createElement("span");
    ltr.className="ltr";
    ltr.textContent=String.fromCharCode(65+i);
    var txt=document.createElement("span");
    txt.className="opt-text";
    txt.textContent=q.opts[i];
    btn.appendChild(ltr);
    btn.appendChild(txt);
    if(q.type==="MS"){
      (function(idx,b){b.addEventListener("click",function(){toggleSel(idx,b);});})(i,btn);
    } else {
      (function(idx){btn.addEventListener("click",function(){pickAnswer(idx);});})(i);
    }
    container.appendChild(btn);
  }
  document.getElementById("submit-btn").style.display=(q.type==="MS")?"inline-block":"none";
  document.getElementById("fb").style.display="none";
  document.getElementById("fb").className="";
  document.getElementById("next-btn").style.display="none";
}

function toggleSel(idx,btn){
  var pos=selMulti.indexOf(idx);
  if(pos>=0){selMulti.splice(pos,1);btn.classList.remove("sel");}
  else{selMulti.push(idx);btn.classList.add("sel");}
}

function submitMulti(){
  var q=shuffled[cur];
  var btns=document.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++) btns[i].disabled=true;
  document.getElementById("submit-btn").style.display="none";
  var correct=q.ans;
  var isOk=(correct.length===selMulti.length);
  if(isOk){for(var i=0;i<correct.length;i++){if(selMulti.indexOf(correct[i])<0){isOk=false;break;}}}
  if(isOk){score++;earnedPts+=q.pts;}
  answered.push({q:q,chosen:selMulti.slice(),isOk:isOk});
  for(var i=0;i<btns.length;i++){
    var idx=parseInt(btns[i].getAttribute("data-i"));
    var inC=correct.indexOf(idx)>=0;
    var inS=selMulti.indexOf(idx)>=0;
    if(inC&&inS) btns[i].classList.add("correct");
    else if(!inC&&inS) btns[i].classList.add("wrong");
    else if(inC&&!inS) btns[i].classList.add("reveal");
  }
  showFb(isOk,q.exp);
}

function pickAnswer(idx){
  var q=shuffled[cur];
  var btns=document.querySelectorAll(".opt");
  for(var i=0;i<btns.length;i++) btns[i].disabled=true;
  var isOk=(idx===q.ans);
  if(isOk){score++;earnedPts+=q.pts;}
  answered.push({q:q,chosen:idx,isOk:isOk});
  btns[idx].classList.add(isOk?"correct":"wrong");
  if(!isOk) btns[q.ans].classList.add("reveal");
  showFb(isOk,q.exp);
}

function showFb(isOk,exp){
  var fb=document.getElementById("fb");
  fb.className=isOk?"fb-ok":"fb-bad";
  fb.style.display="block";
  document.getElementById("fb-title").textContent=isOk?"Correct!":"Incorrect";
  document.getElementById("fb-body").textContent=exp;
  var nb=document.getElementById("next-btn");
  nb.style.display="block";
  nb.textContent=(cur+1<shuffled.length)?"Next Question":"See Results";
}

function nextQ(){
  cur++;
  if(cur<shuffled.length) renderQ();
  else showResults();
}

function showResults(){
  document.getElementById("quiz-screen").style.display="none";
  document.getElementById("results-screen").style.display="block";
  var tot=shuffled.length;
  var pct=Math.round(score/tot*100);
  document.getElementById("r-pct").textContent=pct+"%";
  setTimeout(function(){
    document.getElementById("ring-fil").style.strokeDashoffset=377-(377*pct/100);
  },150);
  var title,sub;
  if(pct>=90){title="Outstanding!";sub="You've mastered Week 5 — CAP & NoSQL are locked in.";}
  else if(pct>=75){title="Great Work!";sub="Solid grasp. Drill your weak topics below.";}
  else if(pct>=50){title="Getting There!";sub="Review your misses and retry before the test.";}
  else{title="Keep Grinding!";sub="Re-read Week 5 slides and retry until 90%+.";}
  document.getElementById("r-title").textContent=title;
  document.getElementById("r-sub").textContent=score+"/"+tot+" correct ("+earnedPts+"/"+totalPts+" pts). "+sub;
  var ts={};
  for(var i=0;i<answered.length;i++){
    var t=answered[i].q.topic;
    if(!ts[t]) ts[t]={c:0,n:0};
    ts[t].n++;
    if(answered[i].isOk) ts[t].c++;
  }
  var tkeys=Object.keys(ts).sort(function(a,b){return(ts[a].c/ts[a].n)-(ts[b].c/ts[b].n);});
  var pills=document.getElementById("r-pills");
  pills.innerHTML="";
  for(var i=0;i<tkeys.length;i++){
    var t=tkeys[i],s=ts[t],r=s.c/s.n;
    var cls=r>=0.75?"str":r>=0.5?"ok":"weak";
    var icon=r>=0.75?"[OK]":r>=0.5?"[~]":"[X]";
    var pill=document.createElement("span");
    pill.className="pill "+cls;
    pill.textContent=icon+" "+t+" ("+s.c+"/"+s.n+")";
    pills.appendChild(pill);
  }
  var rlist=document.getElementById("r-list");
  rlist.innerHTML="";
  var wrong=[],right=[];
  for(var i=0;i<answered.length;i++){
    if(answered[i].isOk) right.push(answered[i]); else wrong.push(answered[i]);
  }
  function makeItem(a,isWrong){
    var q=a.q;
    var item=document.createElement("div");
    item.className="r-item";
    var ico=document.createElement("span");
    ico.className="r-ico";
    ico.textContent=isWrong?"[X]":"[OK]";
    var txt=document.createElement("div");
    txt.className="r-txt";
    var topic=document.createElement("span");
    topic.className="r-topic";
    topic.textContent=q.topic;
    var qspan=document.createElement("span");
    qspan.className="r-q";
    qspan.textContent=q.q.length>90?q.q.substring(0,90)+"...":q.q;
    txt.appendChild(topic);
    txt.appendChild(qspan);
    if(isWrong){
      var chosenTxt,correctTxt;
      if(Array.isArray(a.chosen)){
        chosenTxt=a.chosen.map(function(x){return q.opts[x];}).join(", ");
        correctTxt=q.ans.map(function(x){return q.opts[x];}).join(", ");
      } else {
        chosenTxt=q.opts[a.chosen];
        correctTxt=q.opts[q.ans];
      }
      var wrspan=document.createElement("span");
      wrspan.className="r-wrong";
      wrspan.textContent="Your answer: "+chosenTxt;
      var crspan=document.createElement("span");
      crspan.className="r-wrong";
      crspan.style.color="var(--correct)";
      crspan.textContent="Correct: "+correctTxt;
      txt.appendChild(wrspan);
      txt.appendChild(crspan);
    }
    item.appendChild(ico);
    item.appendChild(txt);
    return item;
  }
  if(wrong.length>0){
    var s1=document.createElement("div");
    s1.className="r-sect";
    s1.textContent="Needs Review ("+wrong.length+")";
    rlist.appendChild(s1);
    for(var i=0;i<wrong.length;i++) rlist.appendChild(makeItem(wrong[i],true));
  }
  if(right.length>0){
    var s2=document.createElement("div");
    s2.className="r-sect";
    s2.textContent="Correct ("+right.length+")";
    rlist.appendChild(s2);
    for(var i=0;i<right.length;i++) rlist.appendChild(makeItem(right[i],false));
  }
}

initQuiz();
</script>
