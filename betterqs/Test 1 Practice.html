<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Big Data and NoSQL Quiz</title>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#23263a;--border:#2e3250;
  --accent:#6c63ff;--accent2:#00d4aa;--correct:#00c97b;--wrong:#ff4f6d;
  --warn:#ffb347;--text:#e8eaf6;--muted:#8b8fa8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:24px 16px;
}
header{text-align:center;margin-bottom:28px;}
header h1{
  font-size:1.9rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
header p{color:var(--muted);margin-top:6px;font-size:.9rem;}
#prog-wrap{width:100%;max-width:780px;background:var(--surface2);
  border-radius:999px;height:7px;margin-bottom:8px;overflow:hidden;}
#prog-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:999px;transition:width .4s;width:0%;}
#prog-label{width:100%;max-width:780px;text-align:right;color:var(--muted);
  font-size:.8rem;margin-bottom:16px;}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:28px 32px;width:100%;max-width:780px;}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.badge{font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;padding:3px 10px;border-radius:999px;}
.b-mc {background:#6c63ff22;color:var(--accent); border:1px solid #6c63ff55;}
.b-ms {background:#ff4f6d22;color:var(--wrong);  border:1px solid #ff4f6d55;}
.b-tf {background:#00d4aa22;color:var(--accent2);border:1px solid #00d4aa55;}
.b-ste{background:#ffb34722;color:var(--warn);   border:1px solid #ffb34755;}
.pts-badge{font-size:.75rem;font-weight:700;color:var(--warn);padding:3px 10px;
  background:#ffb34711;border:1px solid #ffb34733;border-radius:999px;}
.topic-badge{font-size:.7rem;color:var(--muted);padding:3px 10px;
  background:var(--surface2);border:1px solid var(--border);border-radius:999px;}
.qnum{color:var(--muted);font-size:.8rem;margin-left:auto;}
#qtext{font-size:1.05rem;font-weight:600;line-height:1.65;margin-bottom:20px;
  color:var(--text);white-space:pre-wrap;}
#qhint{font-size:.82rem;color:var(--muted);font-style:italic;
  margin-bottom:10px;display:none;padding:8px 12px;
  background:var(--surface2);border-radius:6px;border-left:3px solid var(--accent);}
#qopts{display:flex;flex-direction:column;gap:9px;}
.opt{background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;color:var(--text);cursor:pointer;font-size:.95rem;
  padding:12px 16px;text-align:left;
  display:flex;align-items:flex-start;gap:11px;
  transition:border-color .2s,background .2s;}
.opt:hover:not([disabled]){border-color:var(--accent);background:#2a2d42;}
.ltr{background:var(--border);border-radius:5px;min-width:27px;height:27px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.78rem;flex-shrink:0;transition:background .2s,color .2s;}
.opt-text{line-height:1.45;padding-top:1px;}
.opt.correct{border-color:var(--correct)!important;background:#00c97b18;}
.opt.correct .ltr{background:var(--correct);color:#000;}
.opt.wrong{border-color:var(--wrong)!important;background:#ff4f6d18;}
.opt.wrong .ltr{background:var(--wrong);color:#fff;}
.opt.reveal{border-color:var(--correct)!important;background:#00c97b0d;}
.opt.reveal .ltr{background:#00c97b55;color:var(--correct);}
.opt.sel{border-color:var(--accent)!important;background:#6c63ff18;}
.opt.sel .ltr{background:var(--accent);color:#fff;}
#submit-btn{
  display:none;margin-top:14px;padding:10px 26px;
  background:var(--accent);border:none;border-radius:9px;
  color:#fff;font-weight:700;font-size:.93rem;cursor:pointer;
}
#submit-btn:hover{opacity:.85;}
#fb{display:none;margin-top:20px;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;padding:16px 18px;
  font-size:.93rem;line-height:1.65;}
.fb-title{font-weight:800;font-size:1rem;margin-bottom:8px;}
.fb-ok .fb-title{color:var(--correct);}
.fb-bad .fb-title{color:var(--wrong);}
.fb-body{color:var(--text);white-space:pre-wrap;line-height:1.7;}
#nav-row{display:flex;justify-content:flex-end;margin-top:22px;}
#next-btn{
  display:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:9px;color:#fff;cursor:pointer;
  font-size:.97rem;font-weight:700;padding:11px 28px;
}
#next-btn:hover{opacity:.9;}
/* Results */
#results-screen{display:none;width:100%;max-width:780px;}
.rcard{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:32px;text-align:center;}
.score-ring{width:130px;height:130px;margin:0 auto 22px;
  position:relative;display:flex;align-items:center;justify-content:center;}
.score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.score-ring circle{fill:none;stroke-width:9;}
.trk{stroke:var(--surface2);}
.fil{stroke:var(--accent2);stroke-linecap:round;
  stroke-dasharray:377;stroke-dashoffset:377;
  transition:stroke-dashoffset 1.2s ease;}
.pct-text{position:relative;font-size:1.8rem;font-weight:900;color:var(--accent2);}
.rcard h2{font-size:1.45rem;margin-bottom:7px;}
.r-sub{color:var(--muted);margin-bottom:24px;font-size:.93rem;}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:22px;}
.pill{font-size:.76rem;padding:3px 11px;border-radius:999px;font-weight:600;}
.pill.weak{background:#ff4f6d22;color:var(--wrong);border:1px solid #ff4f6d55;}
.pill.ok  {background:#ffb34722;color:var(--warn); border:1px solid #ffb34755;}
.pill.str {background:#00c97b22;color:var(--correct);border:1px solid #00c97b55;}
.r-sect{color:var(--muted);font-size:.78rem;text-transform:uppercase;
  letter-spacing:.07em;margin:16px 0 8px;text-align:left;}
.r-item{background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:11px 15px;margin-bottom:7px;
  display:flex;gap:11px;align-items:flex-start;text-align:left;}
.r-ico{font-size:1rem;flex-shrink:0;margin-top:2px;}
.r-txt{font-size:.87rem;line-height:1.5;}
.r-topic{font-weight:700;color:var(--accent2);font-size:.74rem;
  text-transform:uppercase;display:block;margin-bottom:2px;}
.r-q{color:var(--text);}
.r-wrong{color:var(--wrong);font-size:.81rem;margin-top:4px;display:block;}
.retry-btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:9px;color:#fff;cursor:pointer;
  font-size:.97rem;font-weight:700;padding:13px 36px;margin-top:26px;
}
.retry-btn:hover{opacity:.9;}
</style>
</head>
<body>
<header>
  <h1>Big Data &amp; NoSQL Quiz</h1>
  <p>61 questions &middot; All topics &middot; Immediate feedback &middot; Deep explanations</p>
</header>
<div id="quiz-screen">
  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <div id="prog-label"></div>
  <div class="card">
    <div class="q-meta">
      <span class="badge b-mc" id="qbadge">MC</span>
      <span class="pts-badge" id="qpts">2 pts</span>
      <span class="topic-badge" id="qtopic">Topic</span>
      <span class="qnum" id="qnum">1/61</span>
    </div>
    <div id="qtext"></div>
    <div id="qhint"></div>
    <div id="qopts"></div>
    <button id="submit-btn" onclick="submitMulti()">Submit Answer</button>
    <div id="fb">
      <div class="fb-title" id="fb-title"></div>
      <div class="fb-body" id="fb-body"></div>
    </div>
    <div id="nav-row">
      <button id="next-btn" onclick="nextQ()">Next Question</button>
    </div>
  </div>
</div>
<div id="results-screen">
  <div class="rcard">
    <div class="score-ring">
      <svg viewBox="0 0 120 120" width="130" height="130">
        <circle class="trk" cx="60" cy="60" r="60"/>
        <circle class="fil" id="ring-fil" cx="60" cy="60" r="60"/>
      </svg>
      <span class="pct-text" id="r-pct"></span>
    </div>
    <h2 id="r-title"></h2>
    <p class="r-sub" id="r-sub"></p>
    <div class="pills" id="r-pills"></div>
    <div id="r-list"></div>
    <button class="retry-btn" onclick="initQuiz()">Retry Quiz</button>
  </div>
</div>

<script>
var QS = [
  {
    "id": "Q15",
    "pts": 2,
    "type": "MC",
    "topic": "Semantic Web",
    "q": "In the context of the Semantic Web, the Open World Assumption states that:",
    "opts": [
      "Our knowledge is incomplete, so everything not listed may be true.",
      "Our knowledge is complete, so everything not listed is false.",
      "If a statement is not in the database, or cannot be inferred, then its validity is false."
    ],
    "ans": 0,
    "exp": "The Open World Assumption (OWA) says: just because something is not stated does not mean it is false - our knowledge base may simply be incomplete. This is the OPPOSITE of the Closed World Assumption (CWA) used in SQL databases where if something is not listed, it is treated as false. Options B and C both describe CWA behaviour."
  },
  {
    "id": "Q1a",
    "pts": 3,
    "type": "MC",
    "topic": "Semantic Web",
    "q": "What is the primary purpose of using RDF in the Semantic Web?",
    "opts": [
      "To store data in key-value format",
      "To represent data as triples (subject-predicate-object)",
      "To enforce strong schema constraints",
      "To store data in relational tables"
    ],
    "ans": 1,
    "exp": "RDF (Resource Description Framework) represents information as triples: Subject - Predicate - Object, e.g. Alice - knows - Bob. These form a directed graph enabling machines to understand meaning and relationships. Key-value format is Redis/DynamoDB. Strong schema constraints are relational. RDF is graph-based, not table-based."
  },
  {
    "id": "Q16",
    "pts": 2,
    "type": "MC",
    "topic": "Semantic Web",
    "q": "What does the OWL language provide for the Semantic Web?",
    "opts": [
      "A query language",
      "A way to define ontologies and relationships",
      "A database schema",
      "A method for data sharding"
    ],
    "ans": 1,
    "exp": "OWL (Web Ontology Language) lets you define ontologies - formal descriptions of concepts, their properties and relationships between them. It goes beyond RDF Schema with richer logic: disjointness, cardinality, equivalence. SPARQL is the RDF query language. OWL is not a DB schema or sharding method."
  },
  {
    "id": "Q17",
    "pts": 2,
    "type": "MC",
    "topic": "Semantic Web",
    "q": "In RDF, what is a triple composed of?",
    "opts": [
      "Table, row, column",
      "Node, edge, property",
      "Subject, predicate, object",
      "Key, value, index"
    ],
    "ans": 2,
    "exp": "An RDF triple is always Subject - Predicate - Object. Example: Alice knows Bob. Millions of triples form a knowledge graph. Table/row/column is relational. Node/edge/property is Neo4j property graph terminology. Key/value/index is NoSQL key-value store terminology."
  },
  {
    "id": "Q18",
    "pts": 2,
    "type": "MC",
    "topic": "Semantic Web",
    "q": "Select the correct statement regarding SKOS:",
    "opts": [
      "SKOS is a common data model for sharing and linking simple knowledge organisation systems",
      "SKOS is a query language for RDF",
      "SKOS is a database for storing triples",
      "SKOS is a graph database system"
    ],
    "ans": 0,
    "exp": "SKOS (Simple Knowledge Organization System) is a W3C standard built on RDF for representing thesauri, taxonomies and controlled vocabularies in a machine-readable way - e.g. the UNESCO thesaurus or Library of Congress subject headings. SPARQL is the RDF query language. Triple stores store triples. SKOS is a vocabulary, not a database."
  },
  {
    "id": "Q1b",
    "pts": 2,
    "type": "MC",
    "topic": "Semantic Web",
    "q": "What kind of NoSQL databases are used for the Semantic Web?",
    "opts": [
      "Key-value databases",
      "Document databases",
      "Graph databases",
      "Column-oriented databases"
    ],
    "ans": 2,
    "exp": "The Semantic Web is built on RDF graphs (triples), so graph databases and triple stores are the natural fit - they natively represent and traverse subject-predicate-object relationships. Examples: Apache Jena, Virtuoso, Amazon Neptune. Key-value stores have no relationship support. Document stores lack native graph traversal."
  },
  {
    "id": "Q4",
    "pts": 2,
    "type": "MS",
    "topic": "NoSQL Fundamentals",
    "q": "Which of the following are key characteristics of NoSQL databases? (Select ALL that apply)",
    "opts": [
      "Schema-less design",
      "Horizontal scalability",
      "Complex join support",
      "Flexible data models"
    ],
    "ans": [
      0,
      1,
      3
    ],
    "exp": "NoSQL databases are characterised by: Schema-less design (no fixed schema required, fields can vary per document), Horizontal scalability (scale out by adding commodity nodes), and Flexible data models (documents, graphs, key-value, wide-column). Complex join support is a RELATIONAL database feature. NoSQL intentionally avoids joins - you denormalise data or embed documents instead."
  },
  {
    "id": "Q33",
    "pts": 2,
    "type": "MC",
    "topic": "NoSQL Fundamentals",
    "q": "Which of the following is a benefit of using NoSQL databases over traditional relational databases?",
    "opts": [
      "Stronger ACID compliance",
      "Better support for unstructured or semi-structured data",
      "Always faster for all workloads",
      "Fixed schema enforcement"
    ],
    "ans": 1,
    "exp": "NoSQL databases excel at handling unstructured or semi-structured data (JSON, logs, sensor data, social graphs) that does not fit neatly into relational tables. They also offer horizontal scalability. Strong ACID compliance is an RDBMS strength. 'Always faster' is false - RDBMS can outperform NoSQL for complex joins. Fixed schemas are a relational feature, not a NoSQL benefit."
  },
  {
    "id": "Q34",
    "pts": 2,
    "type": "MC",
    "topic": "NoSQL Fundamentals",
    "q": "In NoSQL databases, what does \"schema-less\" mean?",
    "opts": [
      "Data must follow a strict schema",
      "Data can be stored without a predefined schema",
      "Schema is enforced at query time only",
      "Only relational data models support schema-less design"
    ],
    "ans": 1,
    "exp": "Schema-less means you can insert documents with varying fields without declaring a fixed structure upfront. In MongoDB, one document can have {name, age} and another {name, email, address} in the same collection. This is schema-on-read flexibility. Strict schema is relational (schema-on-write). Schema-less means no mandatory schema at all."
  },
  {
    "id": "Q37",
    "pts": 2,
    "type": "MC",
    "topic": "NoSQL Fundamentals",
    "q": "What does \"ACID\" stand for in database systems?",
    "opts": [
      "Atomicity, Consistency, Isolation, Durability",
      "Availability, Consistency, Integrity, Distribution",
      "Aggregation, Consistency, Isolation, Data",
      "Atomicity, Concurrency, Indexing, Distribution"
    ],
    "ans": 0,
    "exp": "ACID defines transaction reliability: A = Atomicity (all-or-nothing, fully completes or fully rolls back), C = Consistency (DB moves from one valid state to another), I = Isolation (concurrent transactions do not interfere), D = Durability (committed transactions survive crashes, written to disk). Most NoSQL systems relax ACID in favour of BASE (Basically Available, Soft state, Eventual consistency)."
  },
  {
    "id": "Q22",
    "pts": 2,
    "type": "MC",
    "topic": "CAP Theorem",
    "q": "What does CAP stand for in NoSQL databases?",
    "opts": [
      "Consistency, Availability, Partition tolerance",
      "Concurrency, Atomicity, Persistence",
      "Centralization, Accessibility, Performance",
      "Consistency, Accuracy, Performance"
    ],
    "ans": 0,
    "exp": "CAP Theorem (Brewer's theorem): a distributed system can only guarantee two of three simultaneously. C = Consistency (every read returns the most recent write). A = Availability (every request gets a response, not necessarily the latest data). P = Partition Tolerance (system continues operating despite network partitions). All other options are fabricated acronyms."
  },
  {
    "id": "Q23",
    "pts": 2,
    "type": "MC",
    "topic": "CAP Theorem",
    "q": "Which of the following best describes the CAP theorem?",
    "opts": [
      "A database can guarantee all three: consistency, availability, and partition tolerance.",
      "A database can only guarantee two of the three: consistency, availability, and partition tolerance.",
      "NoSQL databases do not need consistency.",
      "Partition tolerance is optional in distributed systems."
    ],
    "ans": 1,
    "exp": "The CAP theorem proves only two of C, A, P can be guaranteed simultaneously. Since network partitions are unavoidable in real distributed systems, partition tolerance is practically mandatory - meaning the real trade-off is CP vs AP. You cannot guarantee all three. NoSQL systems do care about consistency - they just often trade it for availability. Partition tolerance cannot be safely ignored."
  },
  {
    "id": "Q25",
    "pts": 3,
    "type": "MC",
    "topic": "CAP Theorem",
    "q": "In the context of the CAP theorem, which consistency type allows a system to remain available and partition-tolerant but may return stale data?",
    "opts": [
      "Strong consistency",
      "Eventual consistency",
      "Immediate consistency",
      "Strict consistency"
    ],
    "ans": 1,
    "exp": "Eventual consistency (used in AP systems like Cassandra, DynamoDB) means: all nodes will eventually converge to the same value, but at any given moment some nodes may return stale data. This trades correctness guarantees for higher availability and lower latency. Strong/Strict/Immediate consistency all require the latest value on every read - these sacrifice availability during partitions (CP systems like HBase, Zookeeper)."
  },
  {
    "id": "Q24",
    "pts": 3,
    "type": "MC",
    "topic": "CAP Theorem",
    "q": "You require strict consistency and partition tolerance in the face of network partitions. Which NoSQL database best meets these requirements?",
    "opts": [
      "MongoDB",
      "Cassandra",
      "Redis",
      "Neo4j"
    ],
    "ans": 0,
    "exp": "MongoDB is a CP system - it prioritises Consistency and Partition Tolerance. During a partition, MongoDB may become temporarily unavailable rather than return stale data (single-primary write model). Cassandra is AP - it favours availability and allows eventual consistency. Standalone Redis is CA (no partition tolerance by default). Neo4j is CP but is a graph DB optimised for traversal, not general-purpose storage."
  },
  {
    "id": "Q5",
    "pts": 2,
    "type": "MC",
    "topic": "Key-Value Stores",
    "q": "Which of the following is a characteristic feature of key-value store queries?",
    "opts": [
      "ACID transaction support.",
      "Ability to perform complex join operations.",
      "Limited querying capabilities.",
      "Support for complex data types."
    ],
    "ans": 2,
    "exp": "Key-value stores (Redis, DynamoDB) are designed for O(1) point lookups by exact key only. They intentionally have limited querying - no native range scans, filters, or joins. Most key-value stores are not ACID-compliant (though Redis has some transaction support). Complex joins require relational or graph engines. Values are opaque blobs from the store's perspective."
  },
  {
    "id": "Q6",
    "pts": 2,
    "type": "MC",
    "topic": "Key-Value Stores",
    "q": "Consider a key-value store where a key is a tuple of values. Such a key is called:",
    "opts": [
      "Compound key",
      "Foreign key",
      "Primary key",
      "Shard key"
    ],
    "ans": 0,
    "exp": "A compound key (composite key) is made of multiple fields/components, e.g. (userId, timestamp). In Cassandra the compound key includes a partition key (for routing) plus optional clustering columns (for ordering within a partition). Foreign key is a relational concept linking tables. Primary key is any unique identifier. Shard key determines which node stores data but is a different concept."
  },
  {
    "id": "Q7",
    "pts": 2,
    "type": "MC",
    "topic": "MongoDB",
    "q": "Which of the following is a key feature of MongoDB?",
    "opts": [
      "Strong consistency across nodes",
      "Document-oriented storage using JSON-like format",
      "Graph-based query language",
      "Column-family data model"
    ],
    "ans": 1,
    "exp": "MongoDB is a document database storing data as BSON documents (Binary JSON) - a flexible, JSON-like format supporting nested objects and arrays, ideal for hierarchical semi-structured data without a fixed schema. MongoDB provides tunable but not always strong consistency across all nodes. Its query language is MQL (MongoDB Query Language), not graph-based. Column-family models are Cassandra/HBase."
  },
  {
    "id": "Q8",
    "pts": 2,
    "type": "MC",
    "topic": "MongoDB",
    "q": "Which of the following is a key feature of document databases?",
    "opts": [
      "Data stored in rows and columns",
      "Data stored in JSON-like documents",
      "Data stored in graph structures",
      "Data stored as key-value pairs only"
    ],
    "ans": 1,
    "exp": "Document databases store self-describing JSON/BSON documents where each document can have a different structure. This allows nesting related data (e.g. an order document with an embedded array of line items), reducing the need for joins. Rows/columns = relational. Graph structures = Neo4j/graph databases. Key-value pairs are simpler than full documents."
  },
  {
    "id": "Q14",
    "pts": 2,
    "type": "MC",
    "topic": "MongoDB",
    "q": "In a document database, data is typically stored in:",
    "opts": [
      "Rows and columns",
      "XML documents",
      "JSON-like documents",
      "Tables"
    ],
    "ans": 2,
    "exp": "Document databases like MongoDB store data as JSON-like documents (BSON in MongoDB's case). Each document is a self-contained record with fields and values, including nested objects and arrays. The document model maps naturally to objects in modern programming languages. Rows/columns and tables are relational concepts. XML-based document stores exist but JSON is the modern standard."
  },
  {
    "id": "Q3",
    "pts": 3,
    "type": "MC",
    "topic": "MongoDB",
    "q": "db.glossary.aggregate([{$group:{_id:'$term',count:{$sum:1}}},{$match:{count:{$gt:1}}}]) - which statement is true?",
    "opts": [
      "Returns a count of how many terms are in glossary",
      "Returns a list of terms that appear multiple times in glossary",
      "Returns a list of all unique (distinct) terms in glossary",
      "Returns a count of how many times each term appears in glossary"
    ],
    "ans": 1,
    "exp": "Pipeline trace: Step 1 - $group by term produces {_id: term, count: N} for every unique term. Step 2 - $match count > 1 filters to only terms appearing more than once. Result: a list of DUPLICATED terms in glossary. It does NOT return a single total count. It does NOT return ALL unique terms - only those with duplicates. The $match filters out count=1 entries."
  },
  {
    "id": "Q27b",
    "pts": 2,
    "type": "MC",
    "topic": "MongoDB",
    "q": "db.createCollection('people', {validator:{$jsonSchema:{bsonType:'object', required:['name','surname','email']...}}}) - what does this do?",
    "opts": [
      "Creates a collection with a fixed JSON schema to validate incoming data.",
      "Creates a collection and inserts the specified document.",
      "Applies a JSON schema to an existing collection to validate existing data."
    ],
    "ans": 0,
    "exp": "db.createCollection() with a $jsonSchema validator creates a NEW collection with built-in document validation rules. Any document inserted must pass the schema (required fields, type checks, regex patterns, enum values). This is MongoDB's schema-on-write option. It does NOT insert a document - it only defines the collection and its validation rules. It does NOT retroactively validate existing data in an existing collection."
  },
  {
    "id": "Q26",
    "pts": 2,

  {

    "pts": 2,
    "type": "MC",
    "topic": "Kafka and Streaming",
    "q": "In Apache Kafka, which component is responsible for persisting messages and serving them to consumers?",
    "opts": [
      "Producer",
      "Broker",
      "Consumer Group",
      "ZooKeeper"
    ],
    "ans": 1,
    "exp": "Brokers are the Kafka servers that receive messages from producers, store them on disk in partitioned logs, and serve them to consumers. A Kafka cluster is made up of multiple brokers for fault tolerance and scalability. Producers WRITE data to brokers. Consumer Groups READ from brokers in a coordinated fashion. ZooKeeper (being phased out in KRaft mode) manages cluster metadata and leader election - it does NOT store message data."
  },
  {
    "id": "I18",
    "pts": 2,
    "type": "TF",
    "topic": "Kafka and Streaming",
    "q": "True or False: In Apache Kafka, once a message is consumed and acknowledged by a consumer, it is immediately deleted from the broker.",
    "opts": [
      "True",
      "False"
    ],
    "ans": 1,
    "exp": "FALSE. Kafka uses a log-based retention model. Messages are retained for a configurable period (e.g. 7 days) or until a size limit is reached, REGARDLESS of consumption status. This allows multiple consumer groups to independently replay the same messages and enables replaying historical data - a key feature distinguishing Kafka from traditional message queues like RabbitMQ."
  },
  {
    "id": "I19",
    "pts": 3,
    "type": "STE",
    "topic": "MapReduce",
    "q": "This Python Hadoop Streaming mapper emits (word, 1) pairs. Find the critical error:\n\nimport sys\nfor line in sys.stdin:\n    line = line.strip()\n    words = line.split()\n    for word in words:\n        print(word, '\\t', 1)",
    "opts": [
      "sys.stdin cannot be iterated in Hadoop Streaming",
      "No error - the tab separator is correct",
      "print(word, '\\t', 1) adds spaces around the tab - the key becomes 'word \\t 1' not 'word\\t1'",
      "The script should import hadoop instead of sys"
    ],
    "ans": 2,
    "exp": "The tab separator is malformed. print(word, '\\t', 1) uses Python's default sep=' ', producing: word [space] \\t [space] 1 with spaces around the tab. Hadoop Streaming's default field separator expects NO extra spaces. The correct approach is: print('%s\\t%d' % (word, 1)) or print(f'{word}\\t1') or print(word + '\\t' + str(1)). sys.stdin is exactly how Hadoop Streaming works - that is correct. There is no 'hadoop' Python module to import."
  },
  {
    "id": "I20",
    "pts": 3,
    "type": "MC",
    "topic": "YARN and Cluster Management",
    "q": "In YARN (Yet Another Resource Negotiator), which component allocates resources (CPU, memory containers) to running applications?",
    "opts": [
      "ResourceManager's ApplicationMaster",
      "ResourceManager's Scheduler",
      "NodeManager",
      "JobTracker"
    ],
    "ans": 1,
    "exp": "The ResourceManager's Scheduler is the component that allocates resources across applications. It has pluggable policies: FIFO Scheduler, Capacity Scheduler, and Fair Scheduler. The ApplicationMaster is per-application - it REQUESTS resources from the Scheduler but does not allocate them. NodeManagers manage resources on individual worker nodes and launch containers but do not make allocation decisions. JobTracker is the Hadoop 1.x predecessor to YARN - it no longer exists in Hadoop 2+."
  }

var cur = 0, score = 0, earnedPts = 0, totalPts = 0;
var answered = [], shuffled = [], selMulti = [];

function shuffleArr(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function initQuiz() {
  cur = 0; score = 0; earnedPts = 0; answered = []; selMulti = [];
  shuffled = shuffleArr(QS);
  totalPts = 0;
  for (var i = 0; i < shuffled.length; i++) totalPts += shuffled[i].pts;
  document.getElementById("results-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  renderQ();
}

function renderQ() {
  var q = shuffled[cur];
  selMulti = [];
  var tot = shuffled.length;

  document.getElementById("prog-bar").style.width = (cur / tot * 100) + "%";
  document.getElementById("prog-label").textContent = "Question " + (cur + 1) + " of " + tot;

  var badge = document.getElementById("qbadge");
  var typeMap = {"MC":"Multiple Choice","MS":"Multi-Select","TF":"True / False","STE":"Spot the Error"};
  var clsMap  = {"MC":"badge b-mc","MS":"badge b-ms","TF":"badge b-tf","STE":"badge b-ste"};
  badge.className = clsMap[q.type] || "badge b-mc";
  badge.textContent = typeMap[q.type] || q.type;

  document.getElementById("qpts").textContent = q.pts + " pts";
  document.getElementById("qtopic").textContent = q.topic;
  document.getElementById("qnum").textContent = (cur + 1) + "/" + tot;
  document.getElementById("qtext").textContent = q.q;

  var hint = document.getElementById("qhint");
  if (q.type === "MS") {
    hint.style.display = "block";
    hint.textContent = "Select ALL correct answers, then click Submit.";
  } else {
    hint.style.display = "none";
  }

  var container = document.getElementById("qopts");
  container.innerHTML = "";
  for (var i = 0; i < q.opts.length; i++) {
    var btn = document.createElement("button");
    btn.className = "opt";
    btn.setAttribute("data-i", i);

    var ltr = document.createElement("span");
    ltr.className = "ltr";
    ltr.textContent = String.fromCharCode(65 + i);

    var txt = document.createElement("span");
    txt.className = "opt-text";
    txt.textContent = q.opts[i];

    btn.appendChild(ltr);
    btn.appendChild(txt);

    if (q.type === "MS") {
      (function(idx, b) {
        b.addEventListener("click", function() { toggleSel(idx, b); });
      })(i, btn);
    } else {
      (function(idx) {
        btn.addEventListener("click", function() { pickAnswer(idx); });
      })(i);
    }
    container.appendChild(btn);
  }

  document.getElementById("submit-btn").style.display = (q.type === "MS") ? "inline-block" : "none";
  document.getElementById("fb").style.display = "none";
  document.getElementById("fb").className = "";
  document.getElementById("next-btn").style.display = "none";
}

function toggleSel(idx, btn) {
  var pos = selMulti.indexOf(idx);
  if (pos >= 0) { selMulti.splice(pos, 1); btn.classList.remove("sel"); }
  else { selMulti.push(idx); btn.classList.add("sel"); }
}

function submitMulti() {
  var q = shuffled[cur];
  var btns = document.querySelectorAll(".opt");
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  document.getElementById("submit-btn").style.display = "none";

  var correct = q.ans;
  var isOk = (correct.length === selMulti.length);
  if (isOk) {
    for (var i = 0; i < correct.length; i++) {
      if (selMulti.indexOf(correct[i]) < 0) { isOk = false; break; }
    }
  }
  if (isOk) { score++; earnedPts += q.pts; }
  answered.push({ q: q, chosen: selMulti.slice(), isOk: isOk });

  for (var i = 0; i < btns.length; i++) {
    var idx = parseInt(btns[i].getAttribute("data-i"));
    var inC = correct.indexOf(idx) >= 0;
    var inS = selMulti.indexOf(idx) >= 0;
    if (inC && inS)   btns[i].classList.add("correct");
    else if (!inC && inS) btns[i].classList.add("wrong");
    else if (inC && !inS) btns[i].classList.add("reveal");
  }
  showFb(isOk, q.exp);
}

function pickAnswer(idx) {
  var q = shuffled[cur];
  var btns = document.querySelectorAll(".opt");
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  var isOk = (idx === q.ans);
  if (isOk) { score++; earnedPts += q.pts; }
  answered.push({ q: q, chosen: idx, isOk: isOk });
  btns[idx].classList.add(isOk ? "correct" : "wrong");
  if (!isOk) btns[q.ans].classList.add("reveal");
  showFb(isOk, q.exp);
}

function showFb(isOk, exp) {
  var fb = document.getElementById("fb");
  fb.className = isOk ? "fb-ok" : "fb-bad";
  fb.style.display = "block";
  document.getElementById("fb-title").textContent = isOk ? "Correct!" : "Incorrect";
  document.getElementById("fb-body").textContent = exp;
  var nb = document.getElementById("next-btn");
  nb.style.display = "block";
  nb.textContent = (cur + 1 < shuffled.length) ? "Next Question" : "See Results";
}

function nextQ() {
  cur++;
  if (cur < shuffled.length) renderQ();
  else showResults();
}

function showResults() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("results-screen").style.display = "block";

  var tot = shuffled.length;
  var pct = Math.round(score / tot * 100);
  document.getElementById("r-pct").textContent = pct + "%";
  setTimeout(function() {
    document.getElementById("ring-fil").style.strokeDashoffset = 377 - (377 * pct / 100);
  }, 150);

  var title, sub;
  if (pct >= 90)      { title = "Outstanding!";   sub = "You have mastered this material."; }
  else if (pct >= 75) { title = "Great Work!";     sub = "Solid understanding. Review your misses below."; }
  else if (pct >= 50) { title = "Getting There!";  sub = "Drill the weak topics hard."; }
  else                { title = "Keep Grinding!";  sub = "Revisit your notes and retry."; }
  document.getElementById("r-title").textContent = title;
  document.getElementById("r-sub").textContent = score + "/" + tot + " correct (" + earnedPts + "/" + totalPts + " pts). " + sub;

  var ts = {};
  for (var i = 0; i < answered.length; i++) {
    var t = answered[i].q.topic;
    if (!ts[t]) ts[t] = { c: 0, n: 0 };
    ts[t].n++;
    if (answered[i].isOk) ts[t].c++;
  }
  var tkeys = Object.keys(ts).sort(function(a, b) {
    return (ts[a].c / ts[a].n) - (ts[b].c / ts[b].n);
  });
  var pills = document.getElementById("r-pills");
  pills.innerHTML = "";
  for (var i = 0; i < tkeys.length; i++) {
    var t = tkeys[i], s = ts[t], r = s.c / s.n;
    var cls  = r >= 0.75 ? "str" : r >= 0.5 ? "ok" : "weak";
    var icon = r >= 0.75 ? "[OK]" : r >= 0.5 ? "[~]" : "[X]";
    var pill = document.createElement("span");
    pill.className = "pill " + cls;
    pill.textContent = icon + " " + t + " (" + s.c + "/" + s.n + ")";
    pills.appendChild(pill);
  }

  var rlist = document.getElementById("r-list");
  rlist.innerHTML = "";
  var wrong = [], right = [];
  for (var i = 0; i < answered.length; i++) {
    if (answered[i].isOk) right.push(answered[i]); else wrong.push(answered[i]);
  }

  function makeItem(a, isWrong) {
    var q = a.q;
    var item = document.createElement("div");
    item.className = "r-item";
    var ico = document.createElement("span");
    ico.className = "r-ico";
    ico.textContent = isWrong ? "[X]" : "[OK]";
    var txt = document.createElement("div");
    txt.className = "r-txt";
    var topic = document.createElement("span");
    topic.className = "r-topic";
    topic.textContent = q.topic;
    var qspan = document.createElement("span");
    qspan.className = "r-q";
    qspan.textContent = q.q.length > 90 ? q.q.substring(0, 90) + "..." : q.q;
    txt.appendChild(topic);
    txt.appendChild(qspan);
    if (isWrong) {
      var chosenTxt, correctTxt;
      if (Array.isArray(a.chosen)) {
        chosenTxt  = a.chosen.map(function(x) { return q.opts[x]; }).join(", ");
        correctTxt = q.ans.map(function(x) { return q.opts[x]; }).join(", ");
      } else {
        chosenTxt  = q.opts[a.chosen];
        correctTxt = q.opts[q.ans];
      }
      var wrspan = document.createElement("span");
      wrspan.className = "r-wrong";
      wrspan.textContent = "Your answer: " + chosenTxt;
      var crspan = document.createElement("span");
      crspan.className = "r-wrong";
      crspan.style.color = "var(--correct)";
      crspan.textContent = "Correct: " + correctTxt;
      txt.appendChild(wrspan);
      txt.appendChild(crspan);
    }
    item.appendChild(ico);
    item.appendChild(txt);
    return item;
  }

  if (wrong.length > 0) {
    var s1 = document.createElement("div");
    s1.className = "r-sect";
    s1.textContent = "Needs Review (" + wrong.length + ")";
    rlist.appendChild(s1);
    for (var i = 0; i < wrong.length; i++) rlist.appendChild(makeItem(wrong[i], true));
  }
  if (right.length > 0) {
    var s2 = document.createElement("div");
    s2.className = "r-sect";
    s2.textContent = "Correct (" + right.length + ")";
    rlist.appendChild(s2);
    for (var i = 0; i < right.length; i++) rlist.appendChild(makeItem(right[i], false));
  }
}

initQuiz();
</script>
</body>
</html>
