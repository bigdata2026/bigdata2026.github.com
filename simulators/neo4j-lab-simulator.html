<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO4J LAB SIMULATOR · Blind-Coding Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,900&family=JetBrains+Mono:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b12;
  --bg-panel: #15151f;
  --bg-raised: #1d1d2a;
  --bg-editor: #08080d;
  --border: #2a2a3a;
  --text: #ececf1;
  --text-dim: #8a8aa0;
  --neon: #00ff9d;
  --pink: #ff3b6d;
  --cyan: #18e0e8;
  --yellow: #ffd93d;
  --purple: #a78bfa;
  --red: #ff4d4d;
  --serif: 'Fraunces', serif;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(167,139,250,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,255,157,0.06) 0%, transparent 45%),
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: auto, auto, 40px 40px, 40px 40px;
}
.app { max-width: 980px; margin: 0 auto; padding: 24px 20px 140px; }
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0; margin-bottom: 30px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 16px;
}
.logo { font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
.logo .sp { color: var(--neon); font-style: italic; }
.stats { display: flex; gap: 16px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.stat b { color: var(--yellow); font-family: var(--mono); }
.stat.nailed b { color: var(--neon); }

.progress-wrap { margin-bottom: 36px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}
.progress-bar {
  height: 6px; background: var(--bg-panel); border-radius: 3px;
  overflow: hidden; border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--neon), var(--cyan));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 12px var(--neon);
}

.module { animation: fadeUp 0.5s cubic-bezier(0.2,0.8,0.2,1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.module-badge {
  display: inline-block; font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px; padding: 4px 10px;
  border: 1px solid var(--neon); color: var(--neon);
  border-radius: 3px; margin-bottom: 16px;
}
.module-title {
  font-family: var(--serif); font-weight: 900;
  font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05;
  letter-spacing: -1.5px; margin-bottom: 10px;
}
.module-title i { color: var(--pink); font-weight: 400; }
.module-sub { color: var(--text-dim); font-size: 17px; margin-bottom: 28px; max-width: 640px; }

.block {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px; margin-bottom: 18px;
  position: relative; overflow: hidden;
}
.block::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 3px; height: 100%; background: var(--cyan);
}
.block.task::before { background: var(--yellow); }
.block.hint::before { background: var(--purple); }
.block.solution::before { background: var(--neon); }
.block.trap::before { background: var(--red); }
.block.context::before { background: var(--cyan); }
.block.mcq::before { background: var(--purple); }

.block-label {
  font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px;
  color: var(--text-dim); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.block.task .block-label { color: var(--yellow); }
.block.hint .block-label { color: var(--purple); }
.block.solution .block-label { color: var(--neon); }
.block.trap .block-label { color: var(--red); }
.block.context .block-label { color: var(--cyan); }
.block.mcq .block-label { color: var(--purple); }

.block h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.3px; }
.block h3 i { color: var(--pink); font-weight: 400; }
.block p { margin-bottom: 10px; color: #d4d4dc; }
.block p:last-child { margin-bottom: 0; }
.block ul, .block ol { margin-left: 20px; margin-top: 8px; }
.block li { margin-bottom: 4px; }

code, .code {
  font-family: var(--mono); background: var(--bg-raised);
  padding: 2px 6px; border-radius: 3px; font-size: 0.9em; color: var(--cyan);
}
.code-block {
  font-family: var(--mono); background: var(--bg-editor);
  border: 1px solid var(--border); padding: 14px 16px;
  border-radius: 6px; margin: 12px 0; font-size: 13px;
  white-space: pre-wrap; color: #d4d4dc; line-height: 1.7;
  overflow-x: auto;
}
.code-block .kw { color: var(--pink); font-weight: 700; }
.code-block .label { color: var(--neon); }
.code-block .var { color: var(--cyan); }
.code-block .str { color: var(--yellow); }
.code-block .cm { color: var(--text-dim); font-style: italic; }
.code-block .num { color: var(--yellow); }
.code-block .op { color: #d4d4dc; }

.tip {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(255,217,61,0.08);
  border-left: 2px solid var(--yellow);
  border-radius: 4px; font-size: 14px;
}
.warn {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(255,59,109,0.08);
  border-left: 2px solid var(--pink);
  border-radius: 4px; font-size: 14px;
}

.editor {
  background: var(--bg-editor);
  border: 2px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s, box-shadow 0.2s;
  overflow: hidden;
  margin: 16px 0;
}
.editor:focus-within { border-color: var(--neon); box-shadow: 0 0 20px rgba(0,255,157,0.1); }
.editor-header {
  display: flex; justify-content: space-between; align-items: center;
  background: #050509; padding: 8px 14px;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; border-bottom: 1px solid var(--border);
}
.editor-dots { display: flex; gap: 6px; }
.editor-dots span { width: 10px; height: 10px; border-radius: 50%; background: #333; }
.editor-dots span:nth-child(1) { background: #ff5f57; }
.editor-dots span:nth-child(2) { background: #febc2e; }
.editor-dots span:nth-child(3) { background: #28c840; }
.editor textarea {
  width: 100%;
  background: transparent;
  border: none;
  color: #d4d4dc;
  font-family: var(--mono);
  font-size: 14px;
  padding: 16px;
  resize: vertical;
  min-height: 110px;
  outline: none;
  line-height: 1.6;
}
.editor textarea::placeholder { color: #4a4a5a; font-style: italic; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn {
  font-family: var(--mono); font-size: 12px;
  padding: 10px 18px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-raised);
  color: var(--text); transition: all 0.15s;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--neon); color: #000; border-color: var(--neon); }
.btn.primary:hover { box-shadow: 0 0 20px rgba(0,255,157,0.35); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--pink); border-color: rgba(255,59,109,0.3); }
.btn.success { color: var(--neon); border-color: rgba(0,255,157,0.3); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

/* MCQ options */
.mcq-options { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.mcq-option {
  padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-editor); cursor: pointer; transition: all 0.15s;
  display: flex; gap: 12px; align-items: flex-start;
  font-size: 14px; color: #d4d4dc;
  text-align: left; width: 100%; font-family: var(--sans);
}
.mcq-option:hover:not(:disabled) { border-color: var(--cyan); background: #0d0d15; }
.mcq-option:disabled { cursor: default; }
.mcq-option .letter {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 4px;
  border: 1px solid var(--border); display: flex; align-items: center;
  justify-content: center; font-family: var(--mono); font-size: 12px;
  color: var(--text-dim); font-weight: 700;
}
.mcq-option.correct {
  border-color: var(--neon); background: rgba(0,255,157,0.08); color: var(--neon);
}
.mcq-option.correct .letter { background: var(--neon); color: #000; border-color: var(--neon); }
.mcq-option.wrong {
  border-color: var(--pink); background: rgba(255,59,109,0.08); color: var(--pink);
}
.mcq-option.wrong .letter { background: var(--pink); color: #000; border-color: var(--pink); }
.mcq-option.dimmed { opacity: 0.35; }
.mcq-explain {
  margin-top: 12px; padding: 12px 14px;
  background: rgba(0,255,157,0.05); border-left: 2px solid var(--neon);
  border-radius: 4px; font-size: 14px; color: #d4d4dc;
}
.mcq-explain b { color: var(--neon); font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

/* TOC grid */
.toc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px; margin-top: 24px;
}
.toc-card {
  padding: 20px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg-panel);
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.toc-card::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 100%; height: 2px;
  background: linear-gradient(90deg, var(--neon), var(--cyan));
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.3s;
}
.toc-card:hover {
  border-color: var(--neon); transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,255,157,0.1);
}
.toc-card:hover::before { transform: scaleX(1); }
.toc-card .num {
  font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  letter-spacing: 2px; margin-bottom: 10px;
}
.toc-card .t {
  font-family: var(--serif); font-size: 19px; font-weight: 700;
  margin-bottom: 6px; letter-spacing: -0.3px; line-height: 1.2;
}
.toc-card .t i { color: var(--pink); font-weight: 400; }
.toc-card .meta {
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
  display: flex; justify-content: space-between;
}
.toc-card .meta .done { color: var(--neon); }

/* Pattern cards */
.pattern-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px; margin: 20px 0;
}
.pattern-card {
  padding: 18px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg-panel);
}
.pattern-card h4 {
  font-family: var(--serif); font-size: 17px; font-weight: 700;
  margin-bottom: 10px; letter-spacing: -0.3px;
}
.pattern-card p { font-size: 13px; color: var(--text-dim); }
.pattern-card .code-block { margin: 8px 0; font-size: 12px; }

/* Footer nav */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(11,11,18,0.92); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); padding: 14px 20px;
  z-index: 50;
}
.nav-inner {
  max-width: 980px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.nav-mid {
  font-family: var(--mono); font-size: 11px;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px;
}
.nav-mid b { color: var(--neon); }

/* Graph SVG */
.graph-wrap {
  background: linear-gradient(135deg, #0a0a12, #0f0f18);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; margin: 14px 0; overflow: hidden;
}
.graph-wrap svg { width: 100%; height: auto; display: block; }

/* CAP triangle */
.cap-tri {
  display: flex; justify-content: center; margin: 20px 0;
}
.cap-tri svg text { font-family: var(--mono); }

/* Table */
.data-table {
  width: 100%; border-collapse: collapse; margin: 12px 0;
  font-size: 14px;
}
.data-table th, .data-table td {
  padding: 10px 12px; border: 1px solid var(--border);
  text-align: left; vertical-align: top;
}
.data-table th {
  background: var(--bg-raised); font-family: var(--mono);
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim);
}
.data-table tr:nth-child(even) td { background: rgba(255,255,255,0.015); }

/* Badge chips inline */
.chip {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  margin-right: 4px;
}
.chip.neon { background: rgba(0,255,157,0.15); color: var(--neon); }
.chip.pink { background: rgba(255,59,109,0.15); color: var(--pink); }
.chip.yellow { background: rgba(255,217,61,0.15); color: var(--yellow); }
.chip.cyan { background: rgba(24,224,232,0.15); color: var(--cyan); }
.chip.purple { background: rgba(167,139,250,0.15); color: var(--purple); }

/* Finale */
.finale {
  margin-top: 30px; padding: 36px 28px;
  background: linear-gradient(135deg, rgba(0,255,157,0.06), rgba(24,224,232,0.06));
  border: 1px solid var(--border); border-radius: 14px;
  text-align: center;
}
.finale .emoji { font-size: 54px; margin-bottom: 14px; display: block; }
.finale h3 {
  font-family: var(--serif); font-weight: 900; font-size: 30px;
  letter-spacing: -1px; margin-bottom: 10px;
}
.finale h3 i { color: var(--pink); font-weight: 400; }

/* Utility */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
.muted { color: var(--text-dim); }
.small { font-size: 13px; }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div>
      <div class="logo">NEO4J LAB <span class="sp">SIMULATOR</span></div>
      <div class="small muted" style="font-family: var(--mono); font-size: 11px; margin-top: 4px; letter-spacing: 1px;">
        BLIND-CODING EDITION · F20/21BD
      </div>
    </div>
    <div class="stats">
      <div class="stat">XP <b id="xp">0</b></div>
      <div class="stat nailed">NAILED <b id="nailed">0</b></div>
      <div class="stat">MCQ <b id="mcq-score">0/0</b></div>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>MODULE <span id="mod-num">0/10</span> · <span id="indicator">LOADING</span></span>
      <span><span id="progress-pct">0%</span></span>
    </div>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
    </div>
  </div>

  <div id="content"></div>

</div>

<nav class="nav">
  <div class="nav-inner">
    <button id="btn-prev" class="btn ghost">◀ Back</button>
    <div class="nav-mid">
      XP <b id="nav-xp">0</b> · NAILED <b id="nav-nailed">0</b>
    </div>
    <button id="btn-next" class="btn primary">Next ▶</button>
  </div>
</nav>

<script>
// =====================================================================
// STATE
// =====================================================================
const state = {
  current: 0,
  xp: 0,
  nailed: 0,
  mcqCorrect: 0,
  mcqTotal: 0,
  answered: {},   // { moduleIdx: { questionId: {picked, correct, awarded} } }
  revealed: {},   // { moduleIdx: { taskId: {revealed, nailed} } }
  visited: new Set(),
};

// =====================================================================
// HELPERS
// =====================================================================
function award(xp) {
  state.xp += xp;
  updateBars();
}
function updateBars() {
  document.getElementById('xp').textContent = state.xp;
  document.getElementById('nav-xp').textContent = state.xp;
  document.getElementById('nailed').textContent = state.nailed;
  document.getElementById('nav-nailed').textContent = state.nailed;
  document.getElementById('mcq-score').textContent = state.mcqCorrect + '/' + state.mcqTotal;
}

// MCQ handler
window.pickMCQ = function(modId, qId, pickedIdx, correctIdx, xpReward) {
  const key = `${modId}:${qId}`;
  if (state.answered[key]) return;
  const correct = pickedIdx === correctIdx;
  state.answered[key] = { picked: pickedIdx, correct };
  state.mcqTotal++;
  if (correct) { state.mcqCorrect++; award(xpReward || 10); }
  else { award(2); }
  // Update DOM
  const opts = document.querySelectorAll(`[data-mcq="${key}"] .mcq-option`);
  opts.forEach((o, i) => {
    o.disabled = true;
    if (i === correctIdx) o.classList.add('correct');
    else if (i === pickedIdx) o.classList.add('wrong');
    else o.classList.add('dimmed');
  });
  const exp = document.querySelector(`[data-mcq="${key}"] .mcq-explain`);
  if (exp) exp.style.display = 'block';
  updateBars();
};

// Blind-code reveal handler
window.revealSolution = function(modId, taskId, xpReward) {
  const key = `${modId}:${taskId}`;
  if (state.revealed[key]) return;
  state.revealed[key] = { revealed: true, nailed: false };
  award(xpReward || 10);
  const sol = document.querySelector(`[data-task="${key}"] .solution-wrap`);
  if (sol) sol.style.display = 'block';
  const btn = document.querySelector(`[data-task="${key}"] .btn-reveal`);
  if (btn) { btn.disabled = true; btn.textContent = '✓ Revealed'; }
  const nailBtn = document.querySelector(`[data-task="${key}"] .btn-nailed`);
  if (nailBtn) nailBtn.style.display = 'inline-block';
  const missBtn = document.querySelector(`[data-task="${key}"] .btn-missed`);
  if (missBtn) missBtn.style.display = 'inline-block';
};

window.markNailed = function(modId, taskId) {
  const key = `${modId}:${taskId}`;
  const rec = state.revealed[key];
  if (!rec || rec.nailed) return;
  rec.nailed = true;
  state.nailed++;
  award(20);
  const nailBtn = document.querySelector(`[data-task="${key}"] .btn-nailed`);
  const missBtn = document.querySelector(`[data-task="${key}"] .btn-missed`);
  if (nailBtn) { nailBtn.disabled = true; nailBtn.textContent = '✓ Nailed it'; nailBtn.classList.add('success'); }
  if (missBtn) missBtn.disabled = true;
};

window.markMissed = function(modId, taskId) {
  const key = `${modId}:${taskId}`;
  const rec = state.revealed[key];
  if (!rec) return;
  rec.nailed = false;
  const nailBtn = document.querySelector(`[data-task="${key}"] .btn-nailed`);
  const missBtn = document.querySelector(`[data-task="${key}"] .btn-missed`);
  if (missBtn) { missBtn.disabled = true; missBtn.textContent = '↻ Will review'; missBtn.classList.add('danger'); }
  if (nailBtn) nailBtn.disabled = true;
};

// =====================================================================
// CYPHER SYNTAX HIGHLIGHTER
// =====================================================================
function hl(code) {
  const KEYWORDS = ['MATCH','CREATE','MERGE','WHERE','RETURN','SET','DELETE','DETACH DELETE','REMOVE','WITH','ORDER BY','LIMIT','SKIP','DISTINCT','AS','AND','OR','NOT','CONTAINS','ON CREATE SET','ON MATCH SET','LOAD CSV','WITH HEADERS','FROM','CREATE CONSTRAINT','REQUIRE','IS UNIQUE','CREATE INDEX','FOR','ON','EXPLAIN','CALL','FOREACH','IN','COLLECT'];
  const FUNCS = ['count','min','max','length','toInteger','shortestPath','allShortestPaths','avg','sum','lower','upper','id'];

  let out = '';
  let i = 0;
  const src = code;

  while (i < src.length) {
    // Comments
    if (src[i] === '-' && src[i+1] === '-') {
      let end = src.indexOf('\n', i);
      if (end === -1) end = src.length;
      out += `<span class="cm">${escapeHTML(src.slice(i, end))}</span>`;
      i = end; continue;
    }
    // Strings
    if (src[i] === "'" || src[i] === '"') {
      const quote = src[i];
      let end = i + 1;
      while (end < src.length && src[end] !== quote) end++;
      out += `<span class="str">${escapeHTML(src.slice(i, end + 1))}</span>`;
      i = end + 1; continue;
    }
    // Numbers
    if (/[0-9]/.test(src[i])) {
      let end = i;
      while (end < src.length && /[0-9.]/.test(src[end])) end++;
      out += `<span class="num">${escapeHTML(src.slice(i, end))}</span>`;
      i = end; continue;
    }
    // Labels (after :)
    if (src[i] === ':' && /[A-Za-z_]/.test(src[i+1] || '')) {
      let end = i + 1;
      while (end < src.length && /[A-Za-z0-9_]/.test(src[end])) end++;
      out += `<span class="label">${escapeHTML(src.slice(i, end))}</span>`;
      i = end; continue;
    }
    // Words / keywords / functions
    if (/[A-Za-z_]/.test(src[i])) {
      // Check multi-word keywords first
      let multiMatch = null;
      for (const kw of KEYWORDS) {
        if (kw.includes(' ')) {
          if (src.slice(i, i + kw.length).toUpperCase() === kw &&
              !/[A-Za-z0-9_]/.test(src[i + kw.length] || '')) {
            multiMatch = kw;
            break;
          }
        }
      }
      if (multiMatch) {
        out += `<span class="kw">${escapeHTML(src.slice(i, i + multiMatch.length))}</span>`;
        i += multiMatch.length; continue;
      }
      let end = i;
      while (end < src.length && /[A-Za-z0-9_]/.test(src[end])) end++;
      const word = src.slice(i, end);
      const up = word.toUpperCase();
      const isKw = KEYWORDS.some(k => !k.includes(' ') && k.toUpperCase() === up);
      const isFn = FUNCS.some(f => f.toLowerCase() === word.toLowerCase());
      if (isKw) out += `<span class="kw">${escapeHTML(word)}</span>`;
      else if (isFn) out += `<span class="var">${escapeHTML(word)}</span>`;
      else out += escapeHTML(word);
      i = end; continue;
    }
    // Other — punctuation, whitespace
    out += escapeHTML(src[i]);
    i++;
  }
  return out;
}
function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cb(code) {
  return `<div class="code-block">${hl(code)}</div>`;
}

// TWITTER GRAPH SVG (used in multiple modules)
// =====================================================================
function twitterGraph(highlight = [], highlightEdges = [], dim = false) {
  const users = [
    { id: 'Greenpeace', x: 110, y: 180 },
    { id: 'YouTube',    x: 270, y: 70 },
    { id: 'BBCNews',    x: 270, y: 290 },
    { id: 'UN',         x: 430, y: 180 },
    { id: 'WorldBank',  x: 590, y: 90 },
    { id: 'Bob',        x: 45,  y: 50 },
    { id: 'G7',         x: 590, y: 290 },
  ];
  const follows = [
    ['Greenpeace','YouTube'], ['Greenpeace','BBCNews'], ['Greenpeace','UN'],
    ['UN','WorldBank'],
    ['BBCNews','UN'], ['BBCNews','Greenpeace'], ['BBCNews','WorldBank'],
    ['WorldBank','G7'],
    ['Bob','Greenpeace'], ['Bob','YouTube'],
    ['G7','YouTube'], ['G7','BBCNews'],
  ];
  const map = Object.fromEntries(users.map(u => [u.id, u]));
  const isHi = (id) => highlight.includes(id);
  const edgeHi = (a,b) => highlightEdges.some(([x,y]) => x===a && y===b);

  let svg = `<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a5a"/></marker>
      <marker id="arrHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="${'#18e0e8'}"/></marker>
    </defs>`;
  follows.forEach(([a,b]) => {
    const na = map[a], nb = map[b];
    const dx = nb.x - na.x, dy = nb.y - na.y;
    const len = Math.sqrt(dx*dx + dy*dy);
    const ux = dx/len, uy = dy/len;
    const r = 26;
    const x1 = na.x + ux*r, y1 = na.y + uy*r;
    const x2 = nb.x - ux*r, y2 = nb.y - uy*r;
    const hi = edgeHi(a,b);
    const op = dim && !hi ? 0.12 : 1;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="${hi ? '#18e0e8' : '#4a4a5a'}"
      stroke-width="${hi ? 2.5 : 1.5}" opacity="${op}"
      marker-end="url(#${hi ? 'arrHi' : 'arr'})"/>`;
  });
  users.forEach(u => {
    const hi = isHi(u.id);
    const op = dim && !hi ? 0.3 : 1;
    svg += `<g opacity="${op}">
      <circle cx="${u.x}" cy="${u.y}" r="24"
        fill="${hi ? '#18e0e8' : '#1d1d2a'}"
        stroke="${hi ? '#00ff9d' : '#4a4a5a'}"
        stroke-width="${hi ? 3 : 1.5}"/>
      <text x="${u.x}" y="${u.y + 42}" text-anchor="middle" font-size="12"
        font-family="JetBrains Mono, monospace"
        fill="${hi ? '#00ff9d' : '#d4d4dc'}" font-weight="${hi ? 700 : 400}">${u.id}</text>
    </g>`;
  });
  svg += '</svg>';
  return `<div class="graph-wrap">${svg}</div>`;
}

function block(cls, label, body) {
  return `<div class="block ${cls}"><div class="block-label">${label}</div>${body}</div>`;
}

function mcq(modId, qId, prompt, options, correctIdx, explain, codeBlock) {
  const key = `${modId}:${qId}`;
  const optsHtml = options.map((opt, i) => `
    <button class="mcq-option" onclick="pickMCQ('${modId}','${qId}',${i},${correctIdx},10)">
      <span class="letter">${String.fromCharCode(65+i)}</span>
      <span>${opt}</span>
    </button>`).join('');
  const codeHtml = codeBlock ? cb(codeBlock) : '';
  return `
    <div class="block mcq" data-mcq="${key}">
      <div class="block-label">● INTERPRET · +10 XP</div>
      <p><b>${prompt}</b></p>
      ${codeHtml}
      <div class="mcq-options">${optsHtml}</div>
      <div class="mcq-explain" style="display:none"><b>EXPLANATION</b><br>${explain}</div>
    </div>`;
}

  return `

        'Everyone reachable from Greenpeace in 1 OR 2 FOLLOWS hops (distinct)',
        "Greenpeace's 2 closest connections",
        'Users joined within 2 years'
      ], 1, '*1..2 = 1 OR 2 hops. DISTINCT collapses duplicates when a node is reachable via multiple paths.',
      `MATCH (u:USER {name:"Greenpeace"})-[:FOLLOWS*1..2]->(d:USER)
RETURN DISTINCT d.name`)}
    </div>`;
  }
});

// MODULE 09 — BLIND CODING BOSS
modules.push({
  indicator: 'BLIND CODING · BOSS LEVEL',

  render: () => {

    return `

      ${block('context','● HOW TO GRADE YOURSELF', `
        <ul>

RETURN f.name`)}

      ${blindTask(m,'t2',

RETURN f.name`)}

        'Find mutual followers: pairs (a, b) where a follows b AND b follows a. Return both.',

MATCH (b)-[:FOLLOWS]->(a)
RETURN a, b`,
        "Two MATCH clauses with the same variables = BOTH must hold. Writing just (a)-[:FOLLOWS]-(b) is a direction-agnostic version but doesn't guarantee both directions exist.")}

      ${blindTask(m,'t4',
        'Return all users reachable from "Greenpeace" in exactly 2 FOLLOWS hops. Distinct names only.',

// MODULE 10 — PATTERNS REFERENCE + FINALE
modules.push({
  indicator: 'PATTERNS & EXAM TRAPS',
  title: 'Patterns reference · <i>Top 5 traps</i> · Finale',
  render: () => `
    <div class="module">
      <span class="module-badge" style="border-color: var(--cyan); color: var(--cyan)">◉ MODULE 10 · REFERENCE</span>
      <h1 class="module-title">The <i>Cypher</i> cheat page</h1>
      <p class="module-sub">Everything in one scroll. Save this module — it's your pre-exam 5-minute flash review.</p>

      <div class="pattern-grid">
        <div class="pattern-card">
          <h4>① Create a node</h4>
          ${cb('CREATE (:USER {name:"Bob"})')}
          <p>Label + properties. CREATE never deduplicates.</p>
        </div>
        <div class="pattern-card">
          <h4>② Find nodes by label</h4>
          ${cb('MATCH (u:USER) RETURN u')}
          <p>No filter = every USER. Add <code>{name:"x"}</code> or WHERE to narrow.</p>
        </div>
        <div class="pattern-card">
          <h4>③ Follow a relationship</h4>
          ${cb(`MATCH (u:USER {name:"Bob"})-[:FOLLOWS]->(f)
RETURN f.name`)}
          <p>Arrow direction matters. <code>-[:X]-&gt;</code> vs <code>&lt;-[:X]-</code> vs <code>-[:X]-</code>.</p>
        </div>
        <div class="pattern-card">
          <h4>④ Variable-length path</h4>
          ${cb('MATCH (a)-[:R*1..3]->(b) RETURN b')}
          <p><code>*1..3</code> is INCLUSIVE on both ends. Matches 1, 2, AND 3 hops.</p>
        </div>
        <div class="pattern-card">
          <h4>⑤ Shortest path</h4>
          ${cb(`MATCH p = shortestPath((a)-[:R*]->(b))
RETURN p, length(p)`)}
          <p>One path. For ties: <code>allShortestPaths</code>.</p>
        </div>
        <div class="pattern-card">
          <h4>⑥ Filter with WHERE</h4>
          ${cb('MATCH (u:USER) WHERE u.joined < 2010 RETURN u')}
          <p>WHERE supports <code>&lt;</code>, <code>&gt;</code>, <code>NOT</code>, <code>CONTAINS</code>, <code>IN</code>.</p>
        </div>
        <div class="pattern-card">
          <h4>⑦ Aggregate + WITH</h4>
          ${cb(`MATCH (u)-[:FOLLOWS]->(z)
WITH z, count(u) AS n
WHERE n >= 2 RETURN z`)}
          <p>WITH = pipeline. Required to filter on an aggregate.</p>
        </div>
        <div class="pattern-card">
          <h4>⑧ ORDER BY · LIMIT · SKIP</h4>
          ${cb(`MATCH (u:USER) RETURN u
ORDER BY u.joined DESC
SKIP 10 LIMIT 5`)}
          <p>ASC by default. Combine for pagination.</p>
        </div>
        <div class="pattern-card">
          <h4>⑨ Update with SET / REMOVE</h4>
          ${cb(`SET u.joined = 2020
REMOVE u.nickname`)}
          <p>SET creates-or-updates a property. REMOVE wipes one.</p>
        </div>
        <div class="pattern-card">
          <h4>⑩ DELETE vs DETACH DELETE</h4>
          ${cb(`MATCH (u:USER) DETACH DELETE u`)}
          <p>Plain DELETE fails if there are relationships. DETACH DELETE removes both.</p>
        </div>
        <div class="pattern-card">
          <h4>⑪ MERGE + ON CREATE SET</h4>
          ${cb(`MERGE (u:USER {name:"Ken"})
ON CREATE SET u.joined = 2020`)}
          <p>Find-or-create. ON CREATE SET fires only on creation.</p>
        </div>
        <div class="pattern-card">
          <h4>⑫ Constraint → Index → Import</h4>
          ${cb(`CREATE CONSTRAINT FOR (a:X) REQUIRE a.id IS UNIQUE;
LOAD CSV WITH HEADERS FROM "file:///x.csv" AS row
MERGE (a:X {id: row.id})
ON CREATE SET a.val = toInteger(row.val)`)}
          <p>Always constraint first → MERGE gets fast dedup lookups.</p>
        </div>
      </div>

      ${block('trap',`⚠ TOP 5 EXAM TRAPS`, `
        <ol>
          <li><b>CREATE duplicates.</b> It never dedupes. Use MERGE if you need find-or-create.</li>
          <li><b>DELETE fails on connected nodes.</b> Always DETACH DELETE if rels exist.</li>
          <li><b>Aggregates can't live in WHERE.</b> Pipe through WITH first (<code>WITH z, count(u) AS n WHERE n &gt;= 2</code>).</li>

          <li>"DELETE → fails; DETACH DELETE → works"</li>

          <li>"shortestPath = one; allShortestPaths = every tie"</li>

      <div class="finale">

// =====================================================================
// RENDERING
// =====================================================================
function render() {
  const mod = modules[state.current];
  const content = document.getElementById('content');
  content.innerHTML = mod.render();
  document.getElementById('indicator').textContent = mod.indicator;
  document.getElementById('mod-num').textContent = `${state.current}/${modules.length-1}`;

  const pct = (state.current / (modules.length-1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = Math.round(pct) + '%';

  document.getElementById('btn-prev').disabled = state.current === 0;
  document.getElementById('btn-next').textContent = state.current === modules.length-1 ? '✦ Finish' : 'Next ▶';

  state.visited.add(state.current);

  // TOC module: render grid
  if (state.current === 0) renderTOC();

  // Restore MCQ/task state on re-render
  setTimeout(restoreState, 30);

  // Final module: update stats
  if (state.current === modules.length - 1) {
    setTimeout(() => {
      const fxp = document.getElementById('final-xp');
      const fna = document.getElementById('final-nailed');
      const fmcq = document.getElementById('final-mcq');
      const verdict = document.getElementById('final-verdict');
      if (fxp) fxp.textContent = state.xp;
      if (fna) fna.textContent = state.nailed;
      if (fmcq) fmcq.textContent = state.mcqCorrect + '/' + state.mcqTotal;
      if (verdict) {
        const pct = state.mcqTotal > 0 ? Math.round((state.mcqCorrect / state.mcqTotal) * 100) : 0;
        let msg;
        if (pct >= 85) msg = "You're exam-ready. Go pass that thing.";
        else if (pct >= 70) msg = "Solid. A quick re-run of the weakest module and you're there.";
        else if (pct >= 50) msg = "You've got the shape. Hit the interpretation gauntlet again.";
        else msg = "Restart from Cypher 101 — it'll stick this time.";
        verdict.textContent = msg;
      }
    }, 100);
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function restoreState() {
  // Restore MCQ selections
  Object.entries(state.answered).forEach(([key, rec]) => {
    const opts = document.querySelectorAll(`[data-mcq="${key}"] .mcq-option`);
    if (opts.length === 0) return;
    opts.forEach((o, i) => { o.disabled = true; });
    // Find correct via the on-click handler — we stored picked & correct
    // Need to re-derive correctIdx from the onclick attr
    opts.forEach((o) => {
      const onclick = o.getAttribute('onclick') || '';
      const match = onclick.match(/pickMCQ\('([^']+)','([^']+)',(\d+),(\d+)/);
      if (!match) return;
      const pickedIdx = parseInt(match[3]);
      const correctIdx = parseInt(match[4]);
      if (pickedIdx === correctIdx) o.classList.add('correct');
      else if (pickedIdx === rec.picked) o.classList.add('wrong');
      else o.classList.add('dimmed');
    });
    const exp = document.querySelector(`[data-mcq="${key}"] .mcq-explain`);
    if (exp) exp.style.display = 'block';
  });

  // Restore blind-code reveals
  Object.entries(state.revealed).forEach(([key, rec]) => {
    const sol = document.querySelector(`[data-task="${key}"] .solution-wrap`);
    const btn = document.querySelector(`[data-task="${key}"] .btn-reveal`);
    if (sol) sol.style.display = 'block';
    if (btn) { btn.disabled = true; btn.textContent = '✓ Revealed'; }
    const nailBtn = document.querySelector(`[data-task="${key}"] .btn-nailed`);
    const missBtn = document.querySelector(`[data-task="${key}"] .btn-missed`);
    if (nailBtn && missBtn) {
      if (rec.nailed) {
        nailBtn.style.display = 'inline-block';
        nailBtn.disabled = true; nailBtn.textContent = '✓ Nailed it';
        nailBtn.classList.add('success');
        missBtn.style.display = 'inline-block';
        missBtn.disabled = true;
      } else {
        nailBtn.style.display = 'inline-block';
        missBtn.style.display = 'inline-block';
      }
    }
  });
}

function renderTOC() {
  const grid = document.getElementById('toc-grid');
  if (!grid) return;
  const meta = [
    '', 'theory · 4 MCQ', 'ASCII art · 4 MCQ · 2 drills',
    'mutations · 2 MCQ · 2 drills', 'merge · 2 MCQ · 1 drill',
    'with + agg · 3 MCQ · 1 drill', 'paths · 4 MCQ · 2 drills',
    'loading · 3 MCQ · 2 drills', '★ 10 MCQ', '♦ 12 blind-code drills',
    'cheat sheet'
  ];
  grid.innerHTML = modules.slice(1).map((m, i) => {
    const visited = state.visited.has(i+1);
    return `
      <div class="toc-card" onclick="goTo(${i+1})">
        <div class="num">MODULE ${String(i+1).padStart(2, '0')}</div>
        <div class="t">${m.title}</div>
        <div class="meta">
          <span>${meta[i+1]}</span>
          <span class="${visited ? 'done' : ''}">${visited ? '✓ visited' : '◌ unseen'}</span>
        </div>
      </div>
    `;
  }).join('');
}

function goTo(idx) {
  state.current = idx;
  render();
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (state.current < modules.length - 1) goTo(state.current + 1);
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (state.current > 0) goTo(state.current - 1);
});

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && state.current < modules.length - 1) goTo(state.current + 1);
  if (e.key === 'ArrowLeft' && state.current > 0) goTo(state.current - 1);
});

render();
</script>
