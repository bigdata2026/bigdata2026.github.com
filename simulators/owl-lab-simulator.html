<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWL LAB SIMULATOR · Skip the Protégé Pain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b12;
  --bg-panel: #15151f;
  --bg-raised: #1d1d2a;
  --border: #2a2a3a;
  --text: #ececf1;
  --text-dim: #8a8aa0;
  --neon: #00ff9d;
  --pink: #ff3b6d;
  --cyan: #18e0e8;
  --yellow: #ffd93d;
  --purple: #a78bfa;
  --red: #ff4d4d;
  --serif: 'Fraunces', serif;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 16px; line-height: 1.6; min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,59,109,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,255,157,0.06) 0%, transparent 45%),
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: auto, auto, 40px 40px, 40px 40px;
}
.app { max-width: 980px; margin: 0 auto; padding: 24px 20px 140px; }
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0; margin-bottom: 30px; border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
.logo .owl { color: var(--neon); font-style: italic; }
.stats { display: flex; gap: 16px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.stat b { color: var(--yellow); font-family: var(--mono); }
.progress-wrap { margin-bottom: 40px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}
.progress-bar {
  height: 6px; background: var(--bg-panel); border-radius: 3px;
  overflow: hidden; border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--neon), var(--cyan));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 12px var(--neon);
}
.module { animation: fadeUp 0.5s cubic-bezier(0.2,0.8,0.2,1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.module-badge {
  display: inline-block; font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px; padding: 4px 10px;
  border: 1px solid var(--neon); color: var(--neon); border-radius: 3px; margin-bottom: 16px;
}
.module-title {
  font-family: var(--serif); font-weight: 900;
  font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05;
  letter-spacing: -1.5px; margin-bottom: 10px;
}
.module-title i { color: var(--pink); font-weight: 400; }
.module-sub { color: var(--text-dim); font-size: 17px; margin-bottom: 28px; max-width: 640px; }

.step {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px; margin-bottom: 18px;
  position: relative; overflow: hidden;
}
.step::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 3px; height: 100%; background: var(--cyan);
}
.step.setup::before { background: var(--cyan); }
.step.action::before { background: var(--yellow); }
.step.predict::before { background: var(--pink); }
.step.reveal::before { background: var(--neon); }
.step.trap::before { background: var(--red); }

.step-label {
  font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px;
  color: var(--text-dim); margin-bottom: 10px;
}
.step.setup .step-label { color: var(--cyan); }
.step.action .step-label { color: var(--yellow); }
.step.predict .step-label { color: var(--pink); }
.step.reveal .step-label { color: var(--neon); }
.step.trap .step-label { color: var(--red); }

.step h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.3px; }
.step p { margin-bottom: 10px; color: #d4d4dc; }
.step p:last-child { margin-bottom: 0; }
.step ul { margin-left: 20px; margin-top: 8px; }
.step li { margin-bottom: 4px; }

code, .code {
  font-family: var(--mono); background: var(--bg-raised);
  padding: 2px 6px; border-radius: 3px; font-size: 0.9em; color: var(--cyan);
}
.code-block {
  font-family: var(--mono); background: #08080d;
  border: 1px solid var(--border); padding: 14px 16px;
  border-radius: 6px; margin: 12px 0; font-size: 13px;
  white-space: pre-wrap; color: #d4d4dc; line-height: 1.7;
}
.code-block .kw { color: var(--pink); }
.code-block .cls { color: var(--cyan); }
.code-block .prop { color: var(--yellow); }
.code-block .ind { color: var(--neon); }
.code-block .cm { color: var(--text-dim); font-style: italic; }
.code-block .op { color: var(--purple); font-weight: 700; }

.tip {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(255,217,61,0.08);
  border-left: 2px solid var(--yellow);
  border-radius: 4px; font-size: 14px;
}
.warn {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(255,59,109,0.08);
  border-left: 2px solid var(--pink);
  border-radius: 4px; font-size: 14px;
}
.boom {
  margin-top: 12px; padding: 14px 16px;
  background: rgba(255,77,77,0.1);
  border: 1px solid var(--red);
  border-radius: 6px; font-size: 14px;
  font-family: var(--mono);
  color: #ffb3b3;
}

.btn {
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  padding: 10px 18px; background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: all 0.2s;
  text-transform: uppercase; letter-spacing: 1px;
}
.btn:hover { border-color: var(--neon); color: var(--neon); transform: translateY(-1px); }
.btn-primary {
  background: var(--neon); color: #000; border-color: var(--neon); font-weight: 700;
}
.btn-primary:hover { background: transparent; color: var(--neon); box-shadow: 0 0 20px rgba(0,255,157,0.3); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.predict-opts { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.predict-opt {
  padding: 12px 16px; background: var(--bg-raised);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: all 0.2s; text-align: left;
  color: var(--text); font-family: var(--sans); font-size: 14px;
}
.predict-opt:hover:not(.locked) { border-color: var(--cyan); transform: translateX(4px); }
.predict-opt.correct { background: rgba(0,255,157,0.15); border-color: var(--neon); color: var(--neon); }
.predict-opt.wrong { background: rgba(255,59,109,0.15); border-color: var(--pink); color: var(--pink); }
.predict-opt.locked { cursor: not-allowed; opacity: 0.65; }
.predict-opt.locked.correct, .predict-opt.locked.wrong { opacity: 1; }

.feedback {
  margin-top: 14px; padding: 14px 16px;
  border-radius: 6px; font-size: 14px; display: none;
}
.feedback.show { display: block; animation: fadeUp 0.3s; }
.feedback.good { background: rgba(0,255,157,0.08); border-left: 3px solid var(--neon); }
.feedback.bad { background: rgba(255,59,109,0.08); border-left: 3px solid var(--pink); }

.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(11,11,18,0.95); backdrop-filter: blur(10px);
  border-top: 1px solid var(--border); padding: 14px 20px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; z-index: 100;
}
.nav-bar-inner {
  max-width: 980px; margin: 0 auto; width: 100%;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.module-indicator { font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }

/* ONTOLOGY VISUAL */
.onto-board {
  background: #08080d; border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; margin: 14px 0;
  overflow-x: auto;
}
.onto-board svg { display: block; margin: 0 auto; }

/* CELEBRATION */
.celebration {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--serif); font-size: 80px; font-weight: 900;
  font-style: italic; color: var(--neon);
  text-shadow: 0 0 30px var(--neon);
  pointer-events: none; z-index: 200; opacity: 0;
}
.celebration.show { animation: celebrate 1.2s ease-out; }
@keyframes celebrate {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
  30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
  70% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
}

.hero-start { text-align: center; padding: 40px 10px; }
.hero-start h1 {
  font-family: var(--serif); font-weight: 900;
  font-size: clamp(44px, 9vw, 80px); line-height: 0.95;
  letter-spacing: -2px; margin-bottom: 18px;
}
.hero-start h1 .flash { color: var(--neon); font-style: italic; }
.hero-start .tagline {
  font-size: 18px; color: var(--text-dim);
  max-width: 520px; margin: 0 auto 32px;
}
.feat-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
.feat {
  font-family: var(--mono); font-size: 11px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
}
.toc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px; margin: 20px 0; text-align: left;
}
.toc-card {
  padding: 14px 16px; background: var(--bg-panel);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: all 0.2s;
}
.toc-card:hover { border-color: var(--neon); transform: translateY(-2px); }
.toc-card .num { font-family: var(--mono); font-size: 10px; color: var(--neon); letter-spacing: 2px; }
.toc-card .t { font-family: var(--serif); font-size: 16px; font-weight: 700; margin-top: 4px; line-height: 1.2; }
.toc-card .lab { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 3px; letter-spacing: 1px; }
.toc-card.done { background: rgba(0,255,157,0.04); border-color: var(--neon); }
.toc-card.done .num::after { content: ' ✓'; color: var(--neon); }

.big-emoji { font-size: 60px; text-align: center; margin: 20px 0; }

table {
  width: 100%; border-collapse: collapse; margin: 14px 0;
  font-size: 14px; background: var(--bg-raised);
  border-radius: 8px; overflow: hidden;
}
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th {
  background: #0a0a12; font-family: var(--mono);
  text-transform: uppercase; font-size: 10px;
  letter-spacing: 1px; color: var(--text-dim);
}
tr:last-child td { border-bottom: none; }

.pattern-card {
  background: linear-gradient(135deg, rgba(0,255,157,0.04), rgba(24,224,232,0.04));
  border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin-bottom: 14px;
}
.pattern-card h4 {
  font-family: var(--serif); font-size: 19px; font-weight: 700;
  margin-bottom: 10px; color: var(--yellow);
}

::selection { background: var(--neon); color: #000; }
@media (max-width: 640px) {
  .app { padding: 16px 14px 160px; }
  .stats { display: none; }
  .nav-bar-inner { flex-wrap: wrap; }
  .module-indicator { display: none; }
  .btn { padding: 10px 14px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo"><span class="owl">LAB</span>.sim</div>
    <div class="stats">
      <div class="stat">XP <b id="xp">0</b></div>
      <div class="stat">CORRECT <b id="correct">0</b></div>
      <div class="stat">MOD <b id="mod-num">0/11</b></div>
    </div>
  </header>
  <div class="progress-wrap">
    <div class="progress-label">
      <span>PROGRESS</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <main id="content"></main>
</div>
<div class="nav-bar">
  <div class="nav-bar-inner">
    <button class="btn" id="btn-prev">◀ Back</button>
    <div class="module-indicator" id="indicator">BOOT</div>
    <button class="btn btn-primary" id="btn-next">Next ▶</button>
  </div>
</div>
<div class="celebration" id="celebration"></div>

<script>
const state = {
  current: 0,
  xp: 0,
  correct: 0,
  answered: {},
};

function celebrate(text) {
  const el = document.getElementById('celebration');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function answer(mod, qid, chosenIdx, correctIdx, explanation) {
  const key = `${mod}-${qid}`;
  if (state.answered[key]) return;
  state.answered[key] = true;

  const opts = document.querySelectorAll(`[data-q="${key}"] .predict-opt`);
  opts.forEach((o, i) => {
    o.classList.add('locked');
    if (i === correctIdx) o.classList.add('correct');
    else if (i === chosenIdx) o.classList.add('wrong');
  });

  const fb = document.querySelector(`[data-q="${key}"] .feedback`);
  fb.classList.add('show');
  if (chosenIdx === correctIdx) {
    fb.classList.add('good');
    fb.innerHTML = `<b style="color:var(--neon)">✓ CORRECT.</b> ${explanation}`;
    state.xp += 15;
    state.correct += 1;
    document.getElementById('xp').textContent = state.xp;
    document.getElementById('correct').textContent = state.correct;
    celebrate(['NICE', 'YES', 'BANG', 'GG', 'CLEAN'][Math.floor(Math.random()*5)]);
  } else {
    fb.classList.add('bad');
    fb.innerHTML = `<b style="color:var(--pink)">✗ NOT QUITE.</b> ${explanation}`;
  }
}

const modules = [];

// ============================================================
// MODULE 0 — HERO
// ============================================================
modules.push({
  title: 'START',
  indicator: 'INTRO',
  render: () => `
    <div class="hero-start">
      <h1>OWL<br><span class="flash">LAB</span><br>SIMULATOR</h1>
      <p class="tagline">Skip 3 hours of Protégé pain. Walk through every scenario from Basic OWL Lab, Advanced OWL Lab, and the Vehicle Demo — in one sitting. You predict, the reasoner judges.</p>
      <div class="feat-row">
        <span class="feat">10 LAB SCENARIOS</span>
        <span class="feat">PREDICT + REVEAL</span>
        <span class="feat">ZERO PROTÉGÉ</span>
        <span class="feat">EXAM PATTERNS</span>
      </div>
      <div class="big-emoji">🔬</div>
      <button class="btn btn-primary" style="font-size:16px;padding:14px 28px" onclick="goTo(1)">RUN SIMULATION ▶</button>

      <div style="margin-top:50px">
        <h3 style="font-family:var(--serif); font-size:22px; margin-bottom:16px; color:var(--cyan); text-align:left">The runbook:</h3>
        <div class="toc-grid" id="toc-grid"></div>
      </div>
    </div>
  `
});

// ============================================================
// MODULE 1 — Basic OWL: Disjoint + Deliberate Inconsistency
// ============================================================
modules.push({
  title: 'The disjoint trap',
  indicator: '01 / BASIC LAB',
  render: () => `
    <div class="module">
      <div class="module-badge">BASIC LAB — SCENARIO 1</div>
      <h2 class="module-title">The <i>disjoint</i> trap</h2>
      <p class="module-sub">From Lab 2: we create Course and Person, declare them disjoint, then do something stupid on purpose to see the reasoner scream.</p>

      <div class="step setup">
        <div class="step-label">▶ SETUP — axioms loaded into the ontology</div>
        <div class="code-block"><span class="cls">Course</span> <span class="kw">rdf:type</span> <span class="op">owl:Class</span> .
<span class="cls">Person</span> <span class="kw">rdf:type</span> <span class="op">owl:Class</span> .
<span class="cls">Course</span> <span class="kw">owl:disjointWith</span> <span class="cls">Person</span> .</div>
        <p>Two classes exist. They're declared disjoint — meaning no single individual can be BOTH a Course AND a Person.</p>
      </div>

      <div class="step action">
        <div class="step-label">▶ ACTION — now we assert individuals</div>
        <div class="code-block"><span class="ind">:alice</span> <span class="kw">rdf:type</span> <span class="cls">Person</span> .
<span class="cls cm">// Then we did something stupid on purpose:</span>
<span class="ind">:alice</span> <span class="kw">rdf:type</span> <span class="cls">Course</span> .</div>
      </div>

      <div class="onto-board">
        <svg viewBox="0 0 500 180" width="500">
          <rect x="60" y="30" width="110" height="50" rx="6" fill="none" stroke="#18e0e8" stroke-width="2"/>
          <text x="115" y="58" text-anchor="middle" fill="#18e0e8" font-family="JetBrains Mono" font-size="13">Person</text>
          <text x="115" y="72" text-anchor="middle" fill="#8a8aa0" font-family="JetBrains Mono" font-size="9">CLASS</text>

          <rect x="330" y="30" width="110" height="50" rx="6" fill="none" stroke="#ff3b6d" stroke-width="2"/>
          <text x="385" y="58" text-anchor="middle" fill="#ff3b6d" font-family="JetBrains Mono" font-size="13">Course</text>
          <text x="385" y="72" text-anchor="middle" fill="#8a8aa0" font-family="JetBrains Mono" font-size="9">CLASS</text>

          <line x1="170" y1="55" x2="330" y2="55" stroke="#ffd93d" stroke-width="2" stroke-dasharray="4"/>
          <text x="250" y="48" text-anchor="middle" fill="#ffd93d" font-family="JetBrains Mono" font-size="10">DISJOINT</text>

          <circle cx="250" cy="135" r="20" fill="#00ff9d"/>
          <text x="250" y="140" text-anchor="middle" fill="#000" font-family="JetBrains Mono" font-size="11" font-weight="700">alice</text>

          <line x1="235" y1="125" x2="150" y2="82" stroke="#00ff9d" stroke-width="1.5"/>
          <text x="175" y="115" fill="#8a8aa0" font-family="JetBrains Mono" font-size="9">type</text>

          <line x1="265" y1="125" x2="350" y2="82" stroke="#ff3b6d" stroke-width="1.5" stroke-dasharray="3"/>
          <text x="315" y="115" fill="#ff3b6d" font-family="JetBrains Mono" font-size="9">type ?!</text>
        </svg>
      </div>

      <div class="step predict" data-q="m1-q1">
        <div class="step-label">▶ PREDICT — click reasoner → synchronise</div>
        <p><b>What happens?</b></p>
        <div class="predict-opts">
          <button class="predict-opt" onclick="answer('m1','q1',0,2,'Actually it does cause a conflict. alice can't satisfy both disjoint class memberships.')">Nothing — alice is just in two classes.</button>
          <button class="predict-opt" onclick="answer('m1','q1',1,2,'Disjoint isn't resolved by re-classification — it's a hard contradiction.')">Reasoner removes one of the types automatically.</button>
          <button class="predict-opt" onclick="answer('m1','q1',2,2,'Yes. Ontology goes inconsistent. Protégé screams, everything lights up red, reasoner refuses to give further inferences.')">Ontology becomes INCONSISTENT — reasoner raises an error.</button>
        </div>
        <div class="feedback"></div>
      </div>

      <div class="step reveal">
        <div class="step-label">▶ REVEAL — the explanation window</div>
        <div class="code-block"><span class="cls cm">Explanation for: owl:Thing SubClassOf owl:Nothing</span>
<span class="cls">Course</span> <span class="kw">DisjointWith</span> <span class="cls">Person</span>
<span class="ind">alice</span> <span class="kw">Type</span> <span class="cls">Person</span>
<span class="ind">alice</span> <span class="kw">Type</span> <span class="cls">Course</span></div>
        <p>Protégé literally tells you: "these 3 axioms together = contradiction."</p>
        <div class="tip">🎯 <b>Exam takeaway:</b> Disjoint classes = a HARD wall. Any individual asserted (or inferred!) into both → entire ontology breaks. Reasoner stops giving you useful info until you fix it.</div>
      </div>
    </div>
  `
});

// ============================================================
// MODULE 2 — Basic OWL: Domain/Range Inference + Inverse
// ============================================================
modules.push({
  title: 'Domain, Range, Inverse — auto-inference',
  indicator: '02 / BASIC LAB',
  render: () => `
    <div class="module">
      <div class="module-badge">BASIC LAB — SCENARIO 2</div>
      <h2 class="module-title">The reasoner <i>fills in the blanks</i></h2>
      <p class="module-sub">Lab 2 ends with this power move: assert ONE property, reasoner infers 3+ facts. Classic exam question.</p>

      <div class="step setup">
        <div class="step-label">▶ SETUP — the property definitions</div>
        <div class="code-block"><span class="prop">:studies</span> <span class="kw">rdf:type</span> <span class="op">owl:ObjectProperty</span> ;
         <span class="kw">rdfs:domain</span> <span class="cls">:Student</span> ;
         <span class="kw">rdfs:range</span> <span class="cls">:Course</span> ;
         <span class="kw">owl:inverseOf</span> <span class="prop">:hasStudent</span> .</div>
        <p>Translation:</p>
        <ul>
          <li>If <code>X studies Y</code>, then X must be a Student (domain).</li>
          <li>And Y must be a Course (range).</li>
          <li>And Y hasStudent X automatically (inverse).</li>
        </ul>
      </div>

      <div class="step action">

// ========== RENDERING ==========
function render() {
  const mod = modules[state.current];
  document.getElementById('content').innerHTML = mod.render();
  document.getElementById('indicator').textContent = mod.indicator;
  document.getElementById('mod-num').textContent = `${state.current}/${modules.length-1}`;
  const pct = (state.current / (modules.length-1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = Math.round(pct) + '%';
  document.getElementById('btn-prev').disabled = state.current === 0;
  document.getElementById('btn-next').textContent = state.current === modules.length-1 ? '★ Done' : 'Next ▶';

  if (state.current === 0) renderTOC();

  if (state.current === modules.length - 1) {
    setTimeout(() => {
      const fxp = document.getElementById('final-xp');
      const fcr = document.getElementById('final-correct');
      if (fxp) fxp.textContent = state.xp;
      if (fcr) fcr.textContent = state.correct;
    }, 100);
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderTOC() {
  const grid = document.getElementById('toc-grid');
  if (!grid) return;
  const labLabels = [
    '', 'BASIC LAB', 'BASIC LAB', 'ADV LAB', 'ADV LAB', 'ADV LAB',
    'VEHICLE', 'VEHICLE', 'VEHICLE', 'VEHICLE', 'FINAL'
  ];
  grid.innerHTML = modules.slice(1).map((m, i) => `
    <div class="toc-card" onclick="goTo(${i+1})">
      <div class="num">SCENARIO ${String(i+1).padStart(2, '0')}</div>
      <div class="t">${m.title}</div>
      <div class="lab">${labLabels[i+1]}</div>
    </div>
  `).join('');
}

function goTo(idx) {
  state.current = idx;
  render();
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (state.current < modules.length - 1) goTo(state.current + 1);
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (state.current > 0) goTo(state.current - 1);
});

render();
</script>
