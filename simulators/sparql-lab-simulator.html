<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARQL LAB SIMULATOR · Blind-Coding Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b12;
  --bg-panel: #15151f;
  --bg-raised: #1d1d2a;
  --bg-editor: #08080d;
  --border: #2a2a3a;
  --text: #ececf1;
  --text-dim: #8a8aa0;
  --neon: #00ff9d;
  --pink: #ff3b6d;
  --cyan: #18e0e8;
  --yellow: #ffd93d;
  --purple: #a78bfa;
  --red: #ff4d4d;
  --serif: 'Fraunces', serif;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(167,139,250,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(0,255,157,0.06) 0%, transparent 45%),
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: auto, auto, 40px 40px, 40px 40px;
}
.app { max-width: 980px; margin: 0 auto; padding: 24px 20px 140px; }
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0; margin-bottom: 30px; border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--serif); font-weight: 900; font-size: 22px; letter-spacing: -0.5px; }
.logo .sp { color: var(--purple); font-style: italic; }
.stats { display: flex; gap: 16px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.stat b { color: var(--yellow); font-family: var(--mono); }
.progress-wrap { margin-bottom: 36px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
}
.progress-bar {
  height: 6px; background: var(--bg-panel); border-radius: 3px;
  overflow: hidden; border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--purple), var(--cyan));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 12px var(--purple);
}
.module { animation: fadeUp 0.5s cubic-bezier(0.2,0.8,0.2,1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.module-badge {
  display: inline-block; font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px; padding: 4px 10px;
  border: 1px solid var(--purple); color: var(--purple);
  border-radius: 3px; margin-bottom: 16px;
}
.module-title {
  font-family: var(--serif); font-weight: 900;
  font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05;
  letter-spacing: -1.5px; margin-bottom: 10px;
}
.module-title i { color: var(--pink); font-weight: 400; }
.module-sub { color: var(--text-dim); font-size: 17px; margin-bottom: 28px; max-width: 640px; }

.block {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px; margin-bottom: 18px;
  position: relative; overflow: hidden;
}
.block::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 3px; height: 100%; background: var(--cyan);
}
.block.task::before { background: var(--yellow); }
.block.hint::before { background: var(--purple); }
.block.solution::before { background: var(--neon); }
.block.trap::before { background: var(--red); }
.block.context::before { background: var(--cyan); }

.block-label {
  font-family: var(--mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 2px;
  color: var(--text-dim); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.block.task .block-label { color: var(--yellow); }
.block.hint .block-label { color: var(--purple); }
.block.solution .block-label { color: var(--neon); }
.block.trap .block-label { color: var(--red); }
.block.context .block-label { color: var(--cyan); }

.block h3 { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.3px; }
.block p { margin-bottom: 10px; color: #d4d4dc; }
.block p:last-child { margin-bottom: 0; }
.block ul { margin-left: 20px; margin-top: 8px; }
.block li { margin-bottom: 4px; }

code, .code {
  font-family: var(--mono); background: var(--bg-raised);
  padding: 2px 6px; border-radius: 3px; font-size: 0.9em; color: var(--cyan);
}
.code-block {
  font-family: var(--mono); background: var(--bg-editor);
  border: 1px solid var(--border); padding: 14px 16px;
  border-radius: 6px; margin: 12px 0; font-size: 13px;
  white-space: pre-wrap; color: #d4d4dc; line-height: 1.7;
  overflow-x: auto;
}
.code-block .kw { color: var(--pink); font-weight: 700; }
.code-block .prefix { color: var(--purple); }
.code-block .var { color: var(--neon); }
.code-block .str { color: var(--yellow); }
.code-block .cm { color: var(--text-dim); font-style: italic; }
.code-block .num { color: var(--yellow); }
.code-block .op { color: var(--cyan); }

.tip {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(255,217,61,0.08);
  border-left: 2px solid var(--yellow);
  border-radius: 4px; font-size: 14px;
}
.warn {
  margin-top: 12px; padding: 10px 14px;
  background: rgba(255,59,109,0.08);
  border-left: 2px solid var(--pink);
  border-radius: 4px; font-size: 14px;
}

.editor {
  background: var(--bg-editor);
  border: 2px solid var(--border);
  border-radius: 8px;
  transition: border-color 0.2s;
  overflow: hidden;
  margin: 16px 0;
}
.editor:focus-within { border-color: var(--neon); box-shadow: 0 0 20px rgba(0,255,157,0.1); }
.editor-header {
  display: flex; justify-content: space-between; align-items: center;
  background: #050509; padding: 8px 14px;
  font-family: var(--mono); font-size: 10px;
  color: var(--text-dim); text-transform: uppercase;
  letter-spacing: 1px; border-bottom: 1px solid var(--border);
}
.editor-dots { display: flex; gap: 6px; }
.editor-dots span { width: 10px; height: 10px; border-radius: 50%; background: #333; }
.editor-dots span:nth-child(1) { background: #ff5f57; }
.editor-dots span:nth-child(2) { background: #febc2e; }
.editor-dots span:nth-child(3) { background: #28c840; }
.editor textarea {
  width: 100%;
  background: transparent;
  border: none;
  color: #d4d4dc;
  font-family: var(--mono);
  font-size: 14px;
  padding: 16px;
  resize: vertical;
  min-height: 160px;
  line-height: 1.6;
  outline: none;
  tab-size: 2;
}

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  padding: 10px 18px; background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; transition: all 0.2s;
  text-transform: uppercase; letter-spacing: 1px;
}
.btn:hover { border-color: var(--neon); color: var(--neon); transform: translateY(-1px); }
.btn-primary {
  background: var(--neon); color: #000; border-color: var(--neon);
}
.btn-primary:hover { background: transparent; color: var(--neon); box-shadow: 0 0 20px rgba(0,255,157,0.3); }
.btn-hint { background: var(--purple); color: #000; border-color: var(--purple); }
.btn-hint:hover { background: transparent; color: var(--purple); }
.btn-reveal { background: var(--yellow); color: #000; border-color: var(--yellow); }
.btn-reveal:hover { background: transparent; color: var(--yellow); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.self-rate { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.rate-btn {
  padding: 10px 14px; font-family: var(--mono); font-size: 11px;
  border: 1px solid var(--border); background: var(--bg-raised);
  color: var(--text); border-radius: 6px; cursor: pointer;
  transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px;
}
.rate-btn:hover { transform: translateY(-1px); }
.rate-btn.r-nailed:hover { border-color: var(--neon); color: var(--neon); }
.rate-btn.r-close:hover { border-color: var(--yellow); color: var(--yellow); }
.rate-btn.r-missed:hover { border-color: var(--pink); color: var(--pink); }
.rate-btn.selected.r-nailed { background: var(--neon); color: #000; border-color: var(--neon); }
.rate-btn.selected.r-close { background: var(--yellow); color: #000; border-color: var(--yellow); }
.rate-btn.selected.r-missed { background: var(--pink); color: #fff; border-color: var(--pink); }

.hint-content {
  display: none;
  margin-top: 12px; padding: 12px 16px;
  background: rgba(167,139,250,0.08);
  border-left: 2px solid var(--purple);
  border-radius: 4px; font-size: 14px;
  animation: fadeUp 0.3s;
}
.hint-content.show { display: block; }

.reveal-content {
  display: none; margin-top: 14px;
  animation: fadeUp 0.3s;
}
.reveal-content.show { display: block; }

.result-table {
  width: 100%; border-collapse: collapse; margin: 10px 0;
  background: var(--bg-editor); border-radius: 6px; overflow: hidden;
  font-family: var(--mono); font-size: 12px;
}
.result-table th, .result-table td {
  padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border);
}
.result-table th {
  background: #050509; color: var(--text-dim);
  text-transform: uppercase; font-size: 10px; letter-spacing: 1px;
}
.result-table td { color: var(--cyan); }
.result-table tr:last-child td { border-bottom: none; }

.nav-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(11,11,18,0.95); backdrop-filter: blur(10px);
  border-top: 1px solid var(--border); padding: 14px 20px;
  z-index: 100;
}
.nav-bar-inner {
  max-width: 980px; margin: 0 auto; width: 100%;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.module-indicator { font-family: var(--mono); font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }

.celebration {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--serif); font-size: 80px; font-weight: 900;
  font-style: italic; color: var(--neon);
  text-shadow: 0 0 30px var(--neon);
  pointer-events: none; z-index: 200; opacity: 0;
}
.celebration.show { animation: celebrate 1.2s ease-out; }
@keyframes celebrate {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
  30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
  70% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
}

.hero-start { text-align: center; padding: 40px 10px; }
.hero-start h1 {
  font-family: var(--serif); font-weight: 900;
  font-size: clamp(44px, 9vw, 80px); line-height: 0.95;
  letter-spacing: -2px; margin-bottom: 18px;
}
.hero-start h1 .flash { color: var(--purple); font-style: italic; }
.hero-start .tagline {
  font-size: 18px; color: var(--text-dim);
  max-width: 520px; margin: 0 auto 32px;
}
.feat-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
.feat {
  font-family: var(--mono); font-size: 11px; padding: 6px 12px;
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
}
.toc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px; margin: 20px 0; text-align: left;
}
.toc-card {
  padding: 14px 16px; background: var(--bg-panel);
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: all 0.2s;
}
.toc-card:hover { border-color: var(--purple); transform: translateY(-2px); }
.toc-card .num { font-family: var(--mono); font-size: 10px; color: var(--purple); letter-spacing: 2px; }
.toc-card .t { font-family: var(--serif); font-size: 16px; font-weight: 700; margin-top: 4px; line-height: 1.2; }
.toc-card .lab { font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-top: 3px; letter-spacing: 1px; }
.big-emoji { font-size: 60px; text-align: center; margin: 20px 0; }

table {
  width: 100%; border-collapse: collapse; margin: 14px 0;
  font-size: 14px; background: var(--bg-raised);
  border-radius: 8px; overflow: hidden;
}
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th {
  background: #0a0a12; font-family: var(--mono);
  text-transform: uppercase; font-size: 10px;
  letter-spacing: 1px; color: var(--text-dim);
}
tr:last-child td { border-bottom: none; }

.pattern-card {
  background: linear-gradient(135deg, rgba(167,139,250,0.04), rgba(24,224,232,0.04));
  border: 1px solid var(--border); border-radius: 10px;
  padding: 20px; margin-bottom: 14px;
}
.pattern-card h4 {
  font-family: var(--serif); font-size: 18px; font-weight: 700;
  margin-bottom: 10px; color: var(--yellow);
}

::selection { background: var(--purple); color: #000; }
@media (max-width: 640px) {
  .app { padding: 16px 14px 180px; }
  .stats { display: none; }
  .nav-bar-inner { flex-wrap: wrap; justify-content: center; }
  .module-indicator { display: none; }
  .btn { padding: 10px 12px; font-size: 10px; }
  .editor textarea { font-size: 13px; }
}

.query-counter {
  display: inline-block; background: var(--bg-raised);
  padding: 3px 10px; border-radius: 3px; font-family: var(--mono);
  font-size: 11px; color: var(--yellow); margin-left: 8px;
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo"><span class="sp">SPARQL</span>.lab</div>
    <div class="stats">
      <div class="stat">XP <b id="xp">0</b></div>
      <div class="stat">NAILED <b id="nailed">0</b></div>
      <div class="stat">MOD <b id="mod-num">0/10</b></div>
    </div>
  </header>
  <div class="progress-wrap">
    <div class="progress-label">
      <span>PROGRESS</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <main id="content"></main>
</div>
<div class="nav-bar">
  <div class="nav-bar-inner">
    <button class="btn" id="btn-prev">◀ Back</button>
    <div class="module-indicator" id="indicator">BOOT</div>
    <button class="btn btn-primary" id="btn-next">Next ▶</button>
  </div>
</div>
<div class="celebration" id="celebration"></div>

<script>
const state = {
  current: 0,
  xp: 0,
  nailed: 0,
  rated: {},
};

function celebrate(text) {
  const el = document.getElementById('celebration');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function toggleHint(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('show');
}

function revealSolution(id) {
  const el = document.getElementById(id);
  if (el) el.classList.add('show');
}

function rateQuery(taskId, rating) {
  if (state.rated[taskId]) return;
  state.rated[taskId] = rating;

  const buttons = document.querySelectorAll(`[data-rate="${taskId}"] .rate-btn`);
  buttons.forEach(b => {
    b.disabled = true;
    if (b.dataset.val === rating) b.classList.add('selected');
  });

  const xpMap = { nailed: 20, close: 10, missed: 3 };
  state.xp += xpMap[rating];
  if (rating === 'nailed') {
    state.nailed += 1;
    celebrate(['CLEAN', 'NAILED', 'GG', 'SHIP IT', 'BANG'][Math.floor(Math.random()*5)]);
  } else if (rating === 'close') {
    celebrate('ALMOST');
  }

  document.getElementById('xp').textContent = state.xp;
  document.getElementById('nailed').textContent = state.nailed;
}

const modules = [];

// ============================================================
// MODULE 0 — HERO
// ============================================================
modules.push({
  title: 'START',
  indicator: 'INTRO',
  render: () => `
    <div class="hero-start">
      <h1>SPARQL<br><span class="flash">LAB</span><br>SIMULATOR</h1>
      <p class="tagline">Blind-coding edition. Read the English. Write the SPARQL from scratch in the editor. Peek hints if stuck. Reveal the official solution. Self-rate. Move on. No copy-pasting from PDF.</p>
      <div class="feat-row">
        <span class="feat">14 BLIND TASKS</span>
        <span class="feat">PROGRESSIVE HINTS</span>
        <span class="feat">FULL SOLUTIONS</span>
        <span class="feat">EXAM PATTERNS</span>
      </div>
      <div class="big-emoji">🎯</div>
      <button class="btn btn-primary" style="font-size:16px;padding:14px 28px" onclick="goTo(1)">START BLIND-CODING ▶</button>

      <div style="margin-top:40px; padding:20px; background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; text-align:left">
        <h3 style="font-family:var(--serif); font-size:18px; margin-bottom:12px; color:var(--yellow)">🧠 How to use this (read once)</h3>
        <ol style="margin-left:20px; color:var(--text-dim); font-size:14px">
          <li style="margin-bottom:6px"><b style="color:var(--text)">Read the English.</b> Don't scroll. Don't peek.</li>
          <li style="margin-bottom:6px"><b style="color:var(--text)">Type your query</b> in the dark editor. Get it wrong, that's fine.</li>
          <li style="margin-bottom:6px"><b style="color:var(--text)">Click HINT</b> only if genuinely stuck — it costs nothing but pride.</li>
          <li style="margin-bottom:6px"><b style="color:var(--text)">Click REVEAL</b> to see the official solution. Compare honestly.</li>
          <li><b style="color:var(--text)">Self-rate</b>: Nailed it / Close / Missed it. This trains your metacognition.</li>
        </ol>
      </div>

      <div style="margin-top:40px">
        <h3 style="font-family:var(--serif); font-size:22px; margin-bottom:16px; color:var(--cyan); text-align:left">The lab sprint:</h3>
        <div class="toc-grid" id="toc-grid"></div>
      </div>
    </div>
  `
});

// ============================================================
// MODULE 1 — SPARQL Anatomy + Warm-up
// ============================================================
modules.push({
  title: 'Anatomy + first query',
  indicator: '01 / WARM-UP',
  render: () => `
    <div class="module">
      <div class="module-badge">WARM-UP</div>
      <h2 class="module-title">SPARQL <i>anatomy</i> — 60 second recap</h2>
      <p class="module-sub">Before we blind-code, lock the structure. Every SPARQL query has these pieces in this exact order.</p>

      <div class="block context">
        <div class="block-label">▶ THE TEMPLATE (memorise order)</div>
        <div class="code-block"><span class="kw">PREFIX</span> <span class="prefix">foaf:</span> <span class="op">&lt;http://xmlns.com/foaf/0.1/&gt;</span>        <span class="cm"># 1. Namespaces (no @, no trailing dot!)</span>
<span class="kw">PREFIX</span> <span class="prefix">ex:</span> <span class="op">&lt;http://example.org/&gt;</span>

<span class="kw">SELECT</span> <span class="var">?name</span> <span class="var">?age</span>                             <span class="cm"># 2. Query type + vars</span>

<span class="kw">FROM</span> <span class="op">&lt;http://example.org/mygraph&gt;</span>               <span class="cm"># 3. Graph (optional)</span>

<span class="kw">WHERE</span> {                                          <span class="cm"># 4. Triple patterns</span>
  <span class="var">?person</span> <span class="prefix">foaf:</span>name <span class="var">?name</span> .
  <span class="var">?person</span> <span class="prefix">foaf:</span>age <span class="var">?age</span> .
  <span class="kw">FILTER</span> (<span class="var">?age</span> <span class="op">&gt;</span> <span class="num">18</span>)
}

<span class="kw">ORDER BY</span> <span class="var">?name</span>                                   <span class="cm"># 5. Modifiers</span>
<span class="kw">LIMIT</span> <span class="num">10</span></div>
      </div>

      <div class="block context">
        <div class="block-label">▶ PREFIX GOTCHA (exam trap!)</div>
        <table>
          <tr><th>Context</th><th>Syntax</th></tr>
          <tr><td>Turtle (data files)</td><td><code>@prefix foaf: &lt;...&gt; .</code> (has @ and trailing dot)</td></tr>
          <tr><td>SPARQL (queries)</td><td><code>PREFIX foaf: &lt;...&gt;</code> (NO @, NO dot)</td></tr>
        </table>
        <div class="warn">⚠️ Dropping this in the exam gets you marked wrong even if the logic is perfect.</div>
      </div>

      <div class="block task">
        <div class="block-label">▶ TASK 1 — WARM UP <span class="query-counter">BLIND</span></div>
        <h3>Write the simplest query that exists.</h3>
        <p><b>English:</b> Select the first 100 distinct triples from any graph. Show Subject, Predicate, Object.</p>
        <p><b>This is query #1 from the DBpedia demo.</b> Don't overthink it.</p>
        <div class="editor">
          <div class="editor-header">
            <div class="editor-dots"><span></span><span></span><span></span></div>
            <span>query.sparql</span>
          </div>
          <textarea spellcheck="false" placeholder="SELECT DISTINCT ?Subject ?Predicate ?Object
WHERE {

            <button class="rate-btn r-missed" data-val="missed" onclick="rateQuery('9-3','missed')">✗ Missed</button>
          </div>
        </div>
      </div>

      <div class="block task">
        <div class="block-label">▶ TASK 16 — ASK (yes/no query) <span class="query-counter">BLIND</span></div>
        <h3>Is there at least one author born in Paris?</h3>
        <p><b>English:</b> Return <code>true</code> if yes, <code>false</code> if no. Don't return rows — just a boolean.</p>
        <div class="editor">
          <div class="editor-header">
            <div class="editor-dots"><span></span><span></span><span></span></div>
            <span>query.sparql</span>
          </div>
          <textarea spellcheck="false" placeholder="ASK {
  ...
}"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-hint" onclick="toggleHint('h9-4')">💡 Hint</button>
          <button class="btn btn-reveal" onclick="revealSolution('r9-4')">✨ Reveal Solution</button>
        </div>
        <div class="hint-content" id="h9-4">
          💡 Replace <code>SELECT ... WHERE</code> with just <code>ASK</code>. The endpoint returns only true/false.
        </div>
        <div class="reveal-content" id="r9-4">
          <div class="code-block"><span class="kw">ASK</span> {
  <span class="var">?author</span> <span class="prefix">dbo:</span>birthPlace <span class="prefix">dbr:</span>Paris .
  <span class="var">?work</span> <span class="prefix">dbo:</span>author <span class="var">?author</span> .
}</div>
          <div class="tip">🎯 <b>ASK</b> returns just <code>true</code> or <code>false</code>. Useful for yes/no existence checks. Much cheaper than SELECT when you don't need the actual data.</div>
          <div class="self-rate" data-rate="9-4">
            <button class="rate-btn r-nailed" data-val="nailed" onclick="rateQuery('9-4','nailed')">✓ Nailed it</button>
            <button class="rate-btn r-close" data-val="close" onclick="rateQuery('9-4','close')">~ Close</button>
            <button class="rate-btn r-missed" data-val="missed" onclick="rateQuery('9-4','missed')">✗ Missed</button>
          </div>
        </div>
      </div>
    </div>
  `
});

// ============================================================
// MODULE 10 — EXAM CHEAT SHEET + DONE
// ============================================================
modules.push({
  title: 'SPARQL CHEAT SHEET',
  indicator: '10 / FINAL',
  render: () => `
    <div class="module">
      <div class="module-badge" style="border-color:var(--pink); color:var(--pink)">FINAL — PATTERN DECK</div>
      <h2 class="module-title">Your exam <i>pattern deck</i></h2>
      <p class="module-sub">Every SPARQL question you'll see collapses to one of these. Memorize all.</p>

      <div class="pattern-card">
        <h4>① Basic triple pattern</h4>
        <div class="code-block"><span class="kw">SELECT</span> <span class="var">?s</span> <span class="var">?p</span> <span class="var">?o</span>
<span class="kw">WHERE</span> { <span class="var">?s</span> <span class="var">?p</span> <span class="var">?o</span> } <span class="kw">LIMIT</span> <span class="num">100</span></div>
        <p>Three variables = match any triple. Mix vars with constants to filter.</p>
      </div>

      <div class="pattern-card">
        <h4>② Pivot on a specific entity</h4>
        <div class="code-block"><span class="kw">SELECT</span> <span class="var">?work</span>
<span class="kw">WHERE</span> { <span class="var">?work</span> <span class="prefix">dbo:</span>author <span class="prefix">dbr:</span>Canaletto }</div>
        <p>Replace any variable with a known IRI to pivot the search.</p>
      </div>

      <div class="pattern-card">
        <h4>③ JOIN via shared variable</h4>
        <div class="code-block"><span class="var">?author</span> <span class="prefix">dbo:</span>birthPlace <span class="prefix">dbr:</span>Tokyo .
<span class="var">?work</span> <span class="prefix">dbo:</span>author <span class="var">?author</span> .</div>
        <p>Two triples sharing a variable = SQL-style inner join.</p>
      </div>

      <div class="pattern-card">
        <h4>④ Semicolon shorthand (same subject)</h4>
        <div class="code-block"><span class="var">?s</span> <span class="prefix">dbo:</span>author <span class="prefix">dbr:</span>Canaletto ;
   <span class="prefix">dbo:</span>museum <span class="var">?m</span> .</div>
        <p><b>;</b> continues with same subject. Saves typing when one subject has many props.</p>
      </div>

      <div class="pattern-card">
        <h4>⑤ FILTER — row-level</h4>
        <div class="code-block"><span class="kw">FILTER</span> (<span class="var">?dist</span> <span class="op">&gt;</span> <span class="num">20000</span>)
<span class="kw">FILTER</span> (<span class="kw">regex</span>(<span class="var">?code</span>, <span class="str">"^EH"</span>))
<span class="kw">FILTER</span> (<span class="var">?x</span> <span class="op">&gt;</span> <span class="num">10</span> <span class="op">&amp;&amp;</span> <span class="var">?x</span> <span class="op">&lt;</span> <span class="num">50</span>)</div>
        <p>Numbers, regex, ranges. No BETWEEN.</p>
      </div>

      <div class="pattern-card">
        <h4>⑥ AGGREGATE without grouping</h4>
        <div class="code-block"><span class="kw">SELECT</span> <span class="kw">avg</span>(<span class="var">?x</span>)
<span class="kw">WHERE</span> { <span class="var">?s</span> <span class="prefix">ex:</span>val <span class="var">?x</span> }</div>
        <p>One number across all rows. No GROUP BY needed.</p>
      </div>

      <div class="pattern-card">
        <h4>⑦ GROUP BY</h4>
        <div class="code-block"><span class="kw">SELECT</span> <span class="kw">avg</span>(<span class="var">?x</span>) <span class="kw">as</span> <span class="var">?Avg</span>, <span class="var">?bucket</span>
<span class="kw">WHERE</span> { ... }
<span class="kw">GROUP BY</span> <span class="var">?bucket</span>
<span class="kw">ORDER BY</span> <span class="var">?Avg</span></div>
        <p>Aggregate per bucket. Every non-aggregated SELECT var must be in GROUP BY.</p>
      </div>

      <div class="pattern-card">
        <h4>⑧ HAVING — group-level filter</h4>
        <div class="code-block"><span class="kw">GROUP BY</span> <span class="var">?area</span>
<span class="kw">HAVING</span> (<span class="kw">avg</span>(<span class="var">?x</span>) <span class="op">&gt;</span> <span class="num">200000</span>)</div>
        <p>FILTER works on rows. HAVING works on groups. Can't swap them — they run at different stages.</p>
      </div>

      <div class="pattern-card">
        <h4>⑨ OPTIONAL — left join</h4>
        <div class="code-block"><span class="var">?x</span> <span class="prefix">foaf:</span>name <span class="var">?n</span> .
<span class="kw">OPTIONAL</span> { <span class="var">?x</span> <span class="prefix">foaf:</span>homepage <span class="var">?h</span> }</div>
        <p>Row appears even if OPTIONAL part fails. Variable stays unbound.</p>
      </div>

      <div class="pattern-card">
        <h4>⑩ UNION — alternatives</h4>
        <div class="code-block">{ ... pattern A ... }
<span class="kw">UNION</span>
{ ... pattern B ... }</div>
        <p>Either match qualifies. Variable binds to whichever succeeded.</p>
      </div>

      <div class="pattern-card">
        <h4>⑪ Property paths (transitive)</h4>
        <div class="code-block"><span class="prefix">:</span>Alice <span class="prefix">foaf:</span>knows<span class="op">+</span> <span class="var">?friend</span>    <span class="cm"># 1+ hops</span>
<span class="prefix">:</span>Alice <span class="prefix">foaf:</span>knows<span class="op">*</span> <span class="var">?friend</span>    <span class="cm"># 0+ hops (includes self)</span></div>
        <p>Traverse graphs without writing explicit patterns for each hop.</p>
      </div>

      <div class="pattern-card">
        <h4>⑫ Query types — know when to use each</h4>
        <table>
          <tr><th>Type</th><th>Returns</th></tr>
          <tr><td><code>SELECT</code></td><td>Table of variable bindings</td></tr>
          <tr><td><code>CONSTRUCT</code></td><td>New RDF graph (triples)</td></tr>
          <tr><td><code>DESCRIBE</code></td><td>All triples about a resource</td></tr>
          <tr><td><code>ASK</code></td><td>true / false only</td></tr>
        </table>
      </div>

      <div class="pattern-card" style="background: linear-gradient(135deg, rgba(255,59,109,0.08), rgba(255,77,77,0.08)); border-color: var(--red)">
        <h4 style="color: var(--pink)">⚠️ TOP 5 EXAM TRAPS</h4>
        <ol style="margin-left:20px">
          <li><b>PREFIX</b> has no <code>@</code> and no trailing dot (unlike Turtle).</li>
          <li><b>FILTER vs HAVING</b>: row vs group level. Can't swap.</li>
          <li><b>BETWEEN doesn't exist</b> — use <code>FILTER(?x &gt; a && ?x &lt; b)</code>.</li>
          <li><b>OPTIONAL keeps all base rows</b>; UNION changes which rows appear.</li>
          <li><b>ORDER BY defaults ascending</b> — wrap in <code>DESC()</code> for reverse.</li>
        </ol>
      </div>

      <div style="margin-top: 40px; padding: 30px; background: linear-gradient(135deg, rgba(167,139,250,0.08), rgba(0,255,157,0.08)); border-radius: 12px; text-align: center; border: 1px solid var(--border)">
        <div style="font-size: 50px; margin-bottom: 10px">🏆</div>
        <h3 style="font-family: var(--serif); font-size: 26px; margin-bottom: 10px">SPARQL labs cleared.</h3>
        <p style="color: var(--text-dim); margin-bottom: 16px">
          XP: <b id="final-xp" style="color:var(--yellow)">0</b> ·
          Nailed: <b id="final-nailed" style="color:var(--neon)">0</b> / 14
        </p>
        <p style="font-size: 14px; color: var(--text-dim); max-width: 540px; margin: 0 auto">
          You just worked through 14 blind-coded queries — the MOST important 1.5-hour session in your entire study plan. Review the missed ones. Save this file. 🦉
        </p>
      </div>
    </div>
  `
});

// ========== RENDERING ==========
function render() {
  const mod = modules[state.current];
  document.getElementById('content').innerHTML = mod.render();
  document.getElementById('indicator').textContent = mod.indicator;
  document.getElementById('mod-num').textContent = `${state.current}/${modules.length-1}`;
  const pct = (state.current / (modules.length-1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = Math.round(pct) + '%';
  document.getElementById('btn-prev').disabled = state.current === 0;
  document.getElementById('btn-next').textContent = state.current === modules.length-1 ? '★ Done' : 'Next ▶';

  if (state.current === 0) renderTOC();

  if (state.current === modules.length - 1) {
    setTimeout(() => {
      const fxp = document.getElementById('final-xp');
      const fna = document.getElementById('final-nailed');
      if (fxp) fxp.textContent = state.xp;
      if (fna) fna.textContent = state.nailed;
    }, 100);
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderTOC() {
  const grid = document.getElementById('toc-grid');
  if (!grid) return;
  const labs = [
    '', 'WARM-UP', 'LAB 4 P1', 'LAB 4 TASK 2',
    'LAB 4 TASK 3A', 'LAB 4 TASK 3B', 'LAB 4 TASK 4A',
    'LAB 4 TASK 4B', 'LAB 4 TASK 4C', 'BONUS', 'FINAL'
  ];
  grid.innerHTML = modules.slice(1).map((m, i) => `
    <div class="toc-card" onclick="goTo(${i+1})">
      <div class="num">MODULE ${String(i+1).padStart(2, '0')}</div>
      <div class="t">${m.title}</div>
      <div class="lab">${labs[i+1]}</div>
    </div>
  `).join('');
}

function goTo(idx) {
  state.current = idx;
  render();
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (state.current < modules.length - 1) goTo(state.current + 1);
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (state.current > 0) goTo(state.current - 1);
});

render();
</script>
</body>
</html>
